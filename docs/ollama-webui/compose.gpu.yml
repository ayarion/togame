# NVIDIA GPU を使うときの追加設定
# 事前に NVIDIA Container Toolkit を入れておくこと
# 起動:  docker compose -f compose.yml -f compose.gpu.yml up -d
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
