<!doctype html>
<html lang="ja" data-reason="hima">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>トガメ 介入画面 ダーク案モック</title>
<style>
  /* ==========================================================
     介入画面のダーク案。本体(index.html)には触れていない。
     狙いは3つ。SNSの明るさとの落差／文字を主役にする／
     理由を選んだ瞬間その色で画面が満ちる。
     演出は毎回0.34秒で終わる。長く使うほうを優先している。
     ========================================================== */
  :root{
    --bg:#0b0b0e;
    --surface:#151519;
    --ink:#f4f4f6;
    --ink-2:#9d9da8;
    --ink-3:#63636e;
    --line:#26262d;
    /* 理由の意味づけは本体のまま。無意識＝赤系／目的あり＝青系。
       暗い地では沈むので、彩度と明度だけ上げ直している */
    --r-hima:#ff4d4d;
    --r-tohi:#ff8f85;
    --r-shirabe:#4d9fff;
    --r-work:#8fc4ff;
    --good:#4ade80;
    /* 本体のカーブをそのまま引き継ぐ */
    --ease-out:cubic-bezier(0.23, 1, 0.32, 1);
    --ease-drawer:cubic-bezier(0.32, 0.72, 0, 1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif;
    color:var(--ink);font-size:16px;line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .stage{
    max-width:520px;margin:0 auto;
    padding:0 24px calc(40px + env(safe-area-inset-bottom));
    min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  }

  /* ---------- 入場。頻度で強度を変える本体の考え方は維持する ---------- */
  .intercept{opacity:1;transition:opacity 150ms var(--ease-out)}
  @starting-style{.intercept{opacity:0}}
  .rise{
    opacity:1;transform:translateY(0);
    transition:opacity 260ms var(--ease-out), transform 260ms var(--ease-out);
  }
  @starting-style{.rise{opacity:0;transform:translateY(10px)}}

  /* ---------- 問い詰め ---------- */
  .eyebrow{
    font-size:12px;letter-spacing:.16em;color:var(--ink-3);font-weight:600;
    margin-bottom:14px;
  }
  h1{
    /* 文字を主役にする。SNSの小さい文字が並ぶ画面と物理的に別物にする */
    font-size:clamp(32px, 9.5vw, 42px);
    font-weight:800;line-height:1.28;letter-spacing:-0.02em;
    text-wrap:balance;word-break:auto-phrase;
    margin-bottom:34px;
  }
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{
    display:flex;align-items:center;gap:14px;
    width:100%;min-height:60px;padding:16px 18px;
    text-align:left;font:inherit;font-size:17px;font-weight:700;
    color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:14px;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:transform 150ms var(--ease-out), border-color 150ms var(--ease-out);
  }
  .choice:active{transform:scale(0.975)}
  .choice .dot{width:11px;height:11px;border-radius:50%;flex:none}
  /* 選択肢そのものが色を持っていることを、点だけでなく縁の光でも伝える */
  .choice[data-r="hima"]{--c:var(--r-hima)}
  .choice[data-r="tohi"]{--c:var(--r-tohi)}
  .choice[data-r="shirabe"]{--c:var(--r-shirabe)}
  .choice[data-r="work"]{--c:var(--r-work)}
  .choice .dot{background:var(--c);box-shadow:0 0 12px color-mix(in srgb, var(--c) 60%, transparent)}
  .choice:active{border-color:color-mix(in srgb, var(--c) 55%, var(--line))}
  .context{margin-top:26px;font-size:13px;color:var(--ink-3);line-height:1.75}

  /* ---------- 色が満ちる ----------
     選んだ理由の色が下から上がって画面を覆い、その色の中から次の画面が出る。
     自分の選択が世界を変えた手触りを作る。赤を選ぶとやや気まずい、が狙い */
  .flood{
    position:fixed;inset:0;z-index:40;pointer-events:none;
    transform:scaleY(0);transform-origin:bottom;
    transition:transform 340ms var(--ease-drawer);
  }
  .flood.on{transform:scaleY(1)}
  .flood.out{opacity:0;transition:opacity 280ms var(--ease-out)}
  @media (prefers-reduced-motion:reduce){
    .flood{transition:opacity 120ms linear;transform:none;opacity:0}
    .flood.on{opacity:1}
  }

  /* ---------- 返し ----------
     満ちた色は着地後に上の細い帯としてだけ残す。全面に色を残すと毎日は疲れる */
  .tint{
    position:fixed;left:0;right:0;top:0;height:3px;z-index:5;
    background:var(--c);
  }
  .reason-tag{
    display:inline-flex;align-items:center;gap:9px;
    font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:20px;
  }
  .reason-tag .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
  .alt{color:var(--ink-3);font-size:14px;margin-top:-18px;margin-bottom:6px}
  .actions{display:flex;flex-direction:column;gap:12px;margin-top:38px}
  .btn{
    width:100%;min-height:58px;padding:17px;
    font:inherit;font-size:17px;font-weight:700;
    border:none;border-radius:14px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform 150ms var(--ease-out), opacity 150ms var(--ease-out);
  }
  .btn:active{transform:scale(0.975)}
  .btn-primary{background:var(--ink);color:#0b0b0e}
  .btn-quiet{
    background:none;color:var(--ink-3);font-size:15px;font-weight:500;
    min-height:44px;padding:10px;
    text-decoration:underline;text-underline-offset:4px;
  }
  .btn-quiet:active{opacity:.6;transform:none}

  /* ---------- 引き返した ----------
     数字だけでなく、今日の開いた回数のうち何回引き返したかを点で見せる。
     バッジやレベルは置かない。事実が積み上がるだけにする */
  .big{
    font-size:76px;font-weight:800;line-height:1;letter-spacing:-0.04em;
    color:var(--good);margin-bottom:18px;
  }
  .dots-row{display:flex;gap:7px;margin-bottom:26px}
  .dots-row i{
    width:11px;height:11px;border-radius:50%;
    background:var(--line);display:block;
  }
  .dots-row i.on{
    background:var(--good);box-shadow:0 0 12px color-mix(in srgb, var(--good) 55%, transparent);
  }
  .done p{color:var(--ink-2);margin-bottom:26px}
  /* 完了画面の見出しは文が長い。問い詰めと同じ大きさだと3行に割れて締まらない */
  .done h1{font-size:clamp(25px, 7vw, 31px);line-height:1.4;margin-bottom:14px}

  /* ---------- モック操作バー。本体には入れない ---------- */
  .mockbar{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    display:flex;flex-wrap:wrap;align-items:center;gap:6px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:rgba(11,11,14,.85);border-top:1px solid var(--line);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    font-size:12px;
  }
  .mockbar .lbl{color:var(--ink-3);font-size:11px;letter-spacing:.08em}
  .mockbar button{
    font:inherit;font-size:12px;padding:7px 11px;min-height:32px;
    border:1px solid var(--line);border-radius:8px;
    background:var(--surface);color:var(--ink-2);cursor:pointer;
  }
  .mockbar button[aria-pressed="true"]{background:var(--ink);color:#0b0b0e;border-color:var(--ink);font-weight:700}
  body.embed .mockbar{display:none}
  body:not(.embed) .stage{padding-bottom:96px}
</style>
</head>
<body>

<div id="root"></div>

<div class="mockbar">
  <span class="lbl">画面</span>
  <button data-go="intercept">問い詰め</button>
  <button data-go="followup">返し</button>
  <button data-go="done">引き返した</button>
</div>

<script>
  const R = {
    hima:    { label:"暇つぶし",   color:"var(--r-hima)",    line:"暇なら、それは自由時間ってこと。", min:12, stay:true },
    tohi:    { label:"逃避",       color:"var(--r-tohi)",    line:"何から逃げてる？",               min:15, stay:true },
    shirabe: { label:"調べもの",   color:"var(--r-shirabe)", line:"OK、調べものだね。",             min:6,  stay:false },
    work:    { label:"勉強や仕事", color:"var(--r-work)",    line:"了解、道具として使おう。",       min:5,  stay:false },
  };
  const root = document.getElementById("root");
  const html = document.documentElement;
  const q = new URLSearchParams(location.search);
  if(q.get("embed") === "1") document.body.classList.add("embed");

  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function intercept(){
    root.innerHTML = `
      <div class="stage intercept">
        <p class="eyebrow">INSTAGRAM を開こうとしています</p>
        <h1>なんで開いたの？</h1>
        <div class="choices">
          ${Object.entries(R).map(([id,r])=>`
            <button class="choice" data-r="${id}">
              <span class="dot"></span>${esc(r.label)}
            </button>`).join("")}
        </div>
        <p class="context">今日3回目。ここまでInstagramだけで18分、SNS全体で41分（推定）。</p>
      </div>`;
    root.querySelectorAll(".choice").forEach(b=>{
      b.addEventListener("click", ()=>{
        const id = b.dataset.r;
        // 選んだ色で画面を満たしてから返しの画面へ渡す
        flood(getComputedStyle(b).getPropertyValue("--c"), ()=> followup(id));
      });
    });
  }

  function followup(id){
    const r = R[id];
    html.dataset.reason = id;
    root.innerHTML = `
      <div class="tint" style="--c:${r.color}"></div>
      <div class="stage rise" style="--c:${r.color}">
        <span class="reason-tag"><span class="dot"></span>${esc(r.label)}</span>
        <h1>${esc(r.line)}</h1>
        ${r.stay ? `<p class="alt">いつもの1回ぶん（約${r.min}分）があれば、本を1章読むことができる。</p>` : ""}
        <div class="actions">
          ${r.stay
            ? `<button class="btn btn-primary" id="stay">やめておく</button>
               <button class="btn btn-quiet" id="go">それでも開く</button>`
            : `<button class="btn btn-primary" id="go">それでも開く</button>
               <button class="btn btn-quiet" id="stay">やめておく</button>`}
        </div>
      </div>`;
    document.getElementById("stay").addEventListener("click", done);
    document.getElementById("go").addEventListener("click", ()=> intercept());
  }

  function done(){
    const opened = 5, resisted = 3;
    root.innerHTML = `
      <div class="stage rise done">
        <div class="big">${resisted}</div>
        <div class="dots-row">
          ${Array.from({length:opened}, (_,i)=>`<i class="${i < resisted ? "on" : ""}"></i>`).join("")}
        </div>
        <h1>引き返した。今日${resisted}回目のえらい。</h1>
        <p>このままホーム画面に戻ろう。</p>
        <button class="btn btn-quiet" style="text-align:left;padding-left:0;width:auto">今日のまとめを見る →</button>
      </div>`;
  }

  function flood(color, then){
    const el = document.createElement("div");
    el.className = "flood";
    // ベタ塗りだと毎回まぶしい。下だけ濃くして上を地の色へ落とす
    const c = color.trim();
    el.style.background = `linear-gradient(to top, ${c}, color-mix(in srgb, ${c} 40%, #0b0b0e))`;
    document.body.appendChild(el);
    requestAnimationFrame(()=> el.classList.add("on"));
    setTimeout(()=>{
      then();
      el.classList.add("out");
      setTimeout(()=> el.remove(), 300);
    }, 340);
  }

  document.querySelectorAll("[data-go]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const s = b.dataset.go;
      if(s === "intercept") intercept();
      if(s === "followup")  followup(html.dataset.reason || "hima");
      if(s === "done")      done();
      document.querySelectorAll("[data-go]").forEach(x=>x.setAttribute("aria-pressed", String(x === b)));
    });
  });

  const start = q.get("screen") || "intercept";
  if(q.get("reason")) html.dataset.reason = q.get("reason");
  if(start === "followup") followup(html.dataset.reason || "hima");
  else if(start === "done") done();
  else intercept();
</script>
</body>
</html>
