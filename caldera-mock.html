<!doctype html>
<html lang="ja" data-font="noto" data-ground="invert">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>トガメ 介入画面 Calderaモック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;900&family=Dela+Gothic+One&family=DM+Sans:wght@500&display=swap" rel="stylesheet">
<style>
  /* ==========================================================
     CALDERA-REDESIGN.md に沿った介入画面のモック。
     本体(index.html)には触れていない。
     2つの未決事項を並べて比べるために、2軸の切り替えを持たせてある。
       見出し書体  … Noto Sans JP 900+横圧縮 / Dela Gothic One
       地色        … 暗→明の反転 / 全画面Limestone
     ========================================================== */

  :root{
    /* Caldera パレット */
    --color-ember:#fc5000;
    --color-plasma-violet:#524ae9;
    --color-sulfur:#f5f28e;
    --color-limestone:#f7f6f2;
    --color-pumice:#e2e2df;
    --color-obsidian:#070607;
    --color-chalk:#ffffff;

    --font-body:'DM Sans',-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;

    --radius-cards:40px;
    --radius-pills:800px;
    --radius-small:16px;

    --page-pad:24px;
    --card-padding:40px;
    --element-gap:16px;

    /* 動きは本体のカーブを引き継ぐ */
    --ease-out:cubic-bezier(0.23,1,0.32,1);
    --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  }
  @media (max-width:479px){
    :root{ --page-pad:16px; --card-padding:28px; }
  }

  /* 見出し書体の2案。Bebas Neueは日本語グリフを持たないので候補から外してある */
  :root[data-font="noto"]{ --font-display:'Noto Sans JP','Hiragino Sans',sans-serif; }
  :root[data-font="dela"]{ --font-display:'Dela Gothic One','Hiragino Sans',sans-serif; }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{
    font-family:var(--font-body);font-weight:500;
    font-size:16px;line-height:1.7;
    -webkit-font-smoothing:antialiased;
    background:var(--color-pumice);
  }

  /* ---------- 地色の2案 ----------
     invert: 問い詰めと返しは暗い面。引き返すと明るい面へ反転する
     light : 全画面Limestone基調でCalderaの世界観をそのまま守る */
  .screen{
    min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:calc(var(--card-padding) - 12px) var(--page-pad)
            calc(var(--card-padding) + env(safe-area-inset-bottom));
    position:relative;overflow:hidden;
  }
  :root[data-ground="invert"] .screen{background:var(--color-obsidian);--ink:var(--color-chalk)}
  :root[data-ground="light"]  .screen{background:var(--color-limestone);--ink:var(--color-obsidian)}
  /* 引き返した画面はどちらの案でも明るい面。invertではここが反転点になる。
     地色側のセレクタより詳細度を上げないと上書きできない */
  :root[data-ground] .screen.bright{background:var(--color-limestone);--ink:var(--color-obsidian)}
  body:not(.embed) .screen{padding-bottom:104px}

  /* ---------- タイポグラフィ ---------- */
  .display{
    font-family:var(--font-display);
    font-weight:900;letter-spacing:.02em;line-height:1.24;
    text-wrap:balance;word-break:auto-phrase;color:var(--ink);
  }
  /* Dela Gothic Oneは単一ウェイト。900指定は効かないので400に戻す */
  :root[data-font="dela"] .display{font-weight:400;line-height:1.3}
  /* Noto Sans JPはコンデンス体ではないので横に詰めてCalderaの圧に寄せる */
  :root[data-font="noto"] .display{transform:scaleX(.92);transform-origin:left center}

  h1.ask   {font-size:clamp(38px,11.5vw,52px);margin-bottom:36px}
  h1.say   {font-size:clamp(30px,9vw,42px);margin-bottom:14px}
  h1.done-h{font-size:clamp(24px,7vw,30px);margin-bottom:12px}

  .label{
    font-size:12px;letter-spacing:.16em;font-weight:500;margin-bottom:12px;
    color:color-mix(in srgb, var(--ink) 55%, transparent);
  }
  .context{
    font-size:14px;margin-top:26px;line-height:1.75;
    color:color-mix(in srgb, var(--ink) 45%, transparent);
  }
  .alt{font-size:16px;color:color-mix(in srgb, var(--ink) 50%, transparent)}

  /* ---------- 4択 ----------
     色の役割を個体の識別から群の告発に変えている。
     無意識側だけがEmberで燃え、目的があるなら色はつかず輪郭だけになる */
  .choices{display:flex;flex-direction:column;gap:var(--element-gap)}
  .choice{
    width:100%;min-height:60px;
    padding:18px var(--card-padding);
    border-radius:var(--radius-cards);
    font:inherit;font-size:18px;font-weight:500;text-align:left;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    border:1.5px solid transparent;background:none;
    transition:transform 150ms var(--ease-out);
  }
  .choice:active{transform:scale(.975)}
  .choice.impulse{background:var(--color-ember);color:var(--color-obsidian)}
  .choice.deliberate{border-color:var(--ink);color:var(--ink)}

  /* ---------- ボタン ----------
     主従は色ではなく形で示す。主はEmberのピル、副は下線テキスト */
  .actions{display:flex;flex-direction:column;gap:12px;margin-top:36px}
  .btn-primary{
    width:100%;min-height:56px;padding:12px 24px;
    border:none;border-radius:var(--radius-pills);
    background:var(--color-ember);color:var(--color-obsidian);
    font:inherit;font-size:18px;font-weight:500;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform 150ms var(--ease-out);
  }
  .btn-primary:active{transform:scale(.975)}
  .btn-quiet{
    width:100%;min-height:44px;padding:10px;
    border:none;background:none;font:inherit;font-size:15px;font-weight:500;
    color:color-mix(in srgb, var(--ink) 45%, transparent);
    text-decoration:underline;text-underline-offset:4px;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .btn-quiet:active{opacity:.6}

  /* ---------- 理由タグ ----------
     Sulfurは明色地でコントラストが出ないので、地色としてのみ使いObsidianを載せる */
  .tag{
    /* .screenがflex columnなので、指定しないと横いっぱいに伸びる */
    display:inline-block;align-self:flex-start;margin-bottom:18px;
    padding:6px 14px;border-radius:var(--radius-pills);
    background:var(--color-sulfur);color:var(--color-obsidian);
    font-size:12px;font-weight:500;letter-spacing:.04em;
  }

  /* ---------- 入場。頻度で強度を変える本体の設計を維持する ---------- */
  .fade{opacity:1;transition:opacity 150ms var(--ease-out)}
  @starting-style{.fade{opacity:0}}
  .rise{
    opacity:1;transform:translateY(0);
    transition:opacity 260ms var(--ease-out), transform 260ms var(--ease-out);
  }
  @starting-style{.rise{opacity:0;transform:translateY(10px)}}

  /* ---------- 色が満ちる ---------- */
  .flood{
    position:fixed;inset:0;z-index:40;pointer-events:none;
    transform:scaleY(0);transform-origin:bottom;
    transition:transform 340ms var(--ease-drawer);
  }
  .flood.on{transform:scaleY(1)}
  .flood.out{opacity:0;transition:opacity 280ms var(--ease-out)}
  @media (prefers-reduced-motion:reduce){
    .flood{transition:opacity 120ms linear;transform:none;opacity:0}
    .flood.on{opacity:1}
  }

  /* ---------- 引き返した ----------
     Plasma Violetはここだけ。操作要素ではなく背景装飾としてのみ置く */
  .halftone{
    position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(
      color-mix(in srgb, var(--color-plasma-violet) 26%, transparent) 1.7px,
      transparent 1.8px);
    background-size:24px 24px;
  }
  .done-inner{position:relative}
  .count{
    font-family:var(--font-display);font-weight:900;
    font-size:clamp(64px,20vw,88px);line-height:1;letter-spacing:-.01em;
    color:var(--color-ember);margin-bottom:16px;
  }
  :root[data-font="dela"] .count{font-weight:400}
  .marks{display:flex;gap:7px;margin-bottom:22px}
  .marks i{
    width:11px;height:11px;border-radius:50%;display:block;
    background:color-mix(in srgb, var(--color-obsidian) 15%, transparent);
  }
  .marks i.on{background:var(--color-ember)}
  .done p{margin-bottom:22px;color:color-mix(in srgb, var(--ink) 60%, transparent)}
  .link{
    display:inline-block;font-size:15px;font-weight:500;
    color:color-mix(in srgb, var(--ink) 55%, transparent);
    text-decoration:underline;text-underline-offset:4px;cursor:pointer;
  }

  /* ---------- モック操作バー。本体には入れない ---------- */
  .mockbar{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    display:flex;flex-wrap:wrap;align-items:center;gap:6px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:rgba(7,6,7,.9);border-top:1px solid #2a2a2e;
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;
    font-size:12px;
  }
  .mockbar .lbl{color:#85858e;font-size:11px;letter-spacing:.08em}
  .mockbar .sep{width:1px;height:16px;background:#33333a;margin:0 3px}
  .mockbar button{
    font:inherit;font-size:12px;padding:7px 10px;min-height:32px;
    border:1px solid #33333a;border-radius:8px;
    background:#1a1a1e;color:#b9b9c2;cursor:pointer;
  }
  .mockbar button[aria-pressed="true"]{
    background:var(--color-ember);color:var(--color-obsidian);
    border-color:var(--color-ember);font-weight:700;
  }
  body.embed .mockbar{display:none}
</style>
</head>
<body>

<div id="root"></div>

<div class="mockbar">
  <span class="lbl">書体</span>
  <button data-font-btn="noto">Noto 900</button>
  <button data-font-btn="dela">Dela</button>
  <span class="sep"></span>
  <span class="lbl">地</span>
  <button data-ground-btn="invert">暗→明</button>
  <button data-ground-btn="light">Limestone</button>
  <span class="sep"></span>
  <button data-go="intercept">問い詰め</button>
  <button data-go="followup">返し</button>
  <button data-go="done">引き返した</button>
  <button data-go="grace">素通り</button>
</div>

<script>
  const REASONS = [
    { id:"hima",    label:"暇つぶし",   group:"impulse",    line:"暇なら、それは自由時間ってこと。", min:15 },
    { id:"tohi",    label:"逃避",       group:"impulse",    line:"何から逃げてる？",                 min:20 },
    { id:"shirabe", label:"調べもの",   group:"deliberate", line:"OK、調べものだね。",               min:5  },
    { id:"work",    label:"勉強や仕事", group:"deliberate", line:"了解、道具として使おう。",         min:10 },
  ];
  const R = Object.fromEntries(REASONS.map(r=>[r.id,r]));
  const root = document.getElementById("root");
  const html = document.documentElement;
  const q = new URLSearchParams(location.search);
  if(q.get("embed") === "1") document.body.classList.add("embed");

  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function intercept(){
    root.innerHTML = `
      <div class="screen fade">
        <p class="label">INSTAGRAM を開こうとしています</p>
        <h1 class="display ask">なんで開いたの？</h1>
        <div class="choices">
          ${REASONS.map(r=>`
            <button class="choice ${r.group}" data-r="${r.id}">${esc(r.label)}</button>`).join("")}
        </div>
        <p class="context">今日3回目。ここまでInstagramだけで18分、SNS全体で41分（推定）。</p>
      </div>`;
    root.querySelectorAll(".choice").forEach(b=>{
      b.addEventListener("click", ()=> flood(b.dataset.r, ()=> followup(b.dataset.r)));
    });
  }

  function followup(id){
    const r = R[id];
    const stay = r.group === "impulse";
    root.innerHTML = `
      <div class="screen rise">
        <span class="tag">${esc(r.label)}</span>
        <h1 class="display say">${esc(r.line)}</h1>
        ${stay ? `<p class="alt">いつもの1回ぶん（約${r.min}分）があれば、本を1章読むことができる。</p>` : ""}
        <div class="actions">
          ${stay
            ? `<button class="btn-primary" id="stay">やめておく</button>
               <button class="btn-quiet" id="go">それでも開く</button>`
            : `<button class="btn-primary" id="go">それでも開く</button>
               <button class="btn-quiet" id="stay">やめておく</button>`}
        </div>
      </div>`;
    document.getElementById("stay").addEventListener("click", done);
    document.getElementById("go").addEventListener("click", intercept);
  }

  function done(){
    const opened = 5, resisted = 3;
    root.innerHTML = `
      <div class="screen bright rise done">
        <div class="halftone"></div>
        <div class="done-inner">
          <div class="count">${resisted}</div>
          <div class="marks">
            ${Array.from({length:opened},(_,i)=>`<i class="${i<resisted?"on":""}"></i>`).join("")}
          </div>
          <h1 class="display done-h">引き返した。今日${resisted}回目のえらい。</h1>
          <p>このままホーム画面に戻ろう。</p>
          <span class="link">今日のまとめを見る →</span>
        </div>
      </div>`;
  }

  function grace(){
    root.innerHTML = `
      <div class="screen fade">
        <h1 class="display say">さっき答えたばかり。</h1>
        <p class="alt">5分間は引き止めない。このままどうぞ。</p>
      </div>`;
  }

  function flood(id, then){
    // 無意識側はEmberが満ちる。目的あり側は騒がず、地に馴染む色で静かに送る
    const impulse = R[id].group === "impulse";
    const light = html.dataset.ground === "light";
    const c = impulse ? "#fc5000" : (light ? "#e2e2df" : "#f7f6f2");
    const base = light ? "#f7f6f2" : "#070607";
    const el = document.createElement("div");
    el.className = "flood";
    // ベタ塗りは1日30回では目に強い。下だけ濃くして上を地色へ落とす
    el.style.background = `linear-gradient(to top, ${c}, color-mix(in srgb, ${c} 40%, ${base}))`;
    document.body.appendChild(el);
    requestAnimationFrame(()=> el.classList.add("on"));
    setTimeout(()=>{ then(); el.classList.add("out"); setTimeout(()=> el.remove(), 300); }, 340);
  }

  const SCREENS = { intercept, followup:()=>followup(html.dataset.reason||"hima"), done, grace };

  function sync(){
    document.querySelectorAll("[data-font-btn]").forEach(b=>
      b.setAttribute("aria-pressed", String(b.dataset.fontBtn === html.dataset.font)));
    document.querySelectorAll("[data-ground-btn]").forEach(b=>
      b.setAttribute("aria-pressed", String(b.dataset.groundBtn === html.dataset.ground)));
  }
  document.querySelectorAll("[data-font-btn]").forEach(b=>
    b.addEventListener("click", ()=>{ html.dataset.font = b.dataset.fontBtn; sync(); }));
  document.querySelectorAll("[data-ground-btn]").forEach(b=>
    b.addEventListener("click", ()=>{ html.dataset.ground = b.dataset.groundBtn; sync(); }));
  document.querySelectorAll("[data-go]").forEach(b=>
    b.addEventListener("click", ()=> SCREENS[b.dataset.go]()));

  if(q.get("font"))   html.dataset.font   = q.get("font");
  if(q.get("ground")) html.dataset.ground = q.get("ground");
  if(q.get("reason")) html.dataset.reason = q.get("reason");
  sync();
  (SCREENS[q.get("screen")] || intercept)();
</script>
</body>
</html>
