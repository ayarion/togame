<title>トガメ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='6' cy='10' rx='3' ry='2.2' fill='%232f8f5b' transform='rotate(-30 6 10)'/%3E%3Cellipse cx='26' cy='10' rx='3' ry='2.2' fill='%232f8f5b' transform='rotate(30 26 10)'/%3E%3Cellipse cx='6' cy='23' rx='3' ry='2.2' fill='%232f8f5b' transform='rotate(30 6 23)'/%3E%3Cellipse cx='26' cy='23' rx='3' ry='2.2' fill='%232f8f5b' transform='rotate(-30 26 23)'/%3E%3Cpath d='M16 29 L13.3 24.6 L18.7 24.6 Z' fill='%232f8f5b'/%3E%3Ccircle cx='16' cy='5.2' r='3.4' fill='%232f8f5b'/%3E%3Ccircle cx='14.8' cy='4.5' r='0.55' fill='%230b3d21'/%3E%3Ccircle cx='17.2' cy='4.5' r='0.55' fill='%230b3d21'/%3E%3Ccircle cx='16' cy='17' r='12' fill='%23146b3a'/%3E%3Ccircle cx='16' cy='17' r='9' fill='%23f2fbf6'/%3E%3Cg stroke='%2312321f' stroke-width='1.1' stroke-linecap='round'%3E%3Cline x1='16' y1='9.2' x2='16' y2='10.6'/%3E%3Cline x1='16' y1='23.4' x2='16' y2='24.8'/%3E%3Cline x1='8.2' y1='17' x2='9.6' y2='17'/%3E%3Cline x1='22.4' y1='17' x2='23.8' y2='17'/%3E%3C/g%3E%3Cline x1='16' y1='17' x2='16' y2='12' stroke='%2312321f' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='16' y1='17' x2='19.4' y2='15.1' stroke='%2312321f' stroke-width='1.5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='17' r='1' fill='%2312321f'/%3E%3C/svg%3E">

<style>
  :root{
    --bg:#ffffff;
    --page-bg:#eceef1;
    --ink:#17171a;
    --ink-2:#55565c;
    --ink-3:#8e8f96;
    --hairline:#e8e8ec;
    --hairline-2:#f2f2f5;
    --accent:#1c5cab;
    --accent-deep:#0e3a72;
    --accent-soft:#eef4fc;
    /* 理由は2系統に統一。無意識＝赤／目的あり＝青（同系内は濃淡で区別） */
    --r-hima:#d94a45;
    --r-tohi:#ef8c86;
    --r-shirabe:#2f7fd0;
    --r-work:#8fbcea;
    --tag-red-bg:#fdeceb;
    --tag-red-ink:#c0403b;
    --tag-blue-bg:#eaf2fc;
    --tag-blue-ink:#1f66ad;
    --good:#006300;
    /* animations.dev: 標準イージングは弱いのでカスタムカーブを使う */
    --ease-out:cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out:cubic-bezier(0.77, 0, 0.175, 1);
    --ease-drawer:cubic-bezier(0.32, 0.72, 0, 1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--page-bg)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif;
    color:var(--ink);
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:520px;margin:0 auto;padding:0 24px calc(48px + env(safe-area-inset-bottom));min-height:100vh}

  .eyebrow{
    font-size:12px;letter-spacing:.14em;color:var(--ink-3);
    font-weight:600;
  }
  h1{font-size:28px;font-weight:700;line-height:1.35;letter-spacing:-0.01em;text-wrap:balance;word-break:auto-phrase}
  h2{font-size:17px;font-weight:700;letter-spacing:.01em;color:var(--ink);margin-bottom:14px}

  button{
    font:inherit;color:inherit;background:none;border:none;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    /* apple-design: フィードバックはpointer-downの瞬間に。transformのみ遷移させる */
    transition:transform 160ms var(--ease-out);
  }
  button:active{transform:scale(0.97)}
  button:focus-visible,input:focus-visible,details summary:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;
  }

  /* ---- 入場アニメーション ----
     頻度で強度を変える（animations.dev）:
     問い詰め画面=毎日何十回→フェードのみ150ms / 選択後の画面=250msのrise */
  .intercept{
    opacity:1;
    transition:opacity 150ms var(--ease-out);
  }
  @starting-style{
    .intercept{opacity:0}
  }
  .screen-rise{
    opacity:1;transform:translateY(0);
    transition:opacity 250ms var(--ease-out), transform 250ms var(--ease-out);
  }
  @starting-style{
    .screen-rise{opacity:0;transform:translateY(8px)}
  }
  main>section{
    opacity:1;transform:translateY(0);
    transition:opacity 300ms var(--ease-out), transform 300ms var(--ease-out);
  }
  main>section:nth-of-type(2){transition-delay:40ms}
  main>section:nth-of-type(3){transition-delay:80ms}
  main>section:nth-of-type(4){transition-delay:120ms}
  main>section:nth-of-type(5){transition-delay:160ms}
  main>section:nth-of-type(6){transition-delay:200ms}
  @starting-style{
    main>section{opacity:0;transform:translateY(8px)}
  }

  /* ---- intercept ---- */
  .intercept{display:flex;flex-direction:column;justify-content:center;min-height:100vh;padding:48px 0;gap:0}
  .intercept .eyebrow{margin-bottom:10px}
  .intercept h1{margin-bottom:36px}
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{
    display:flex;align-items:center;gap:14px;
    width:100%;padding:16px 18px;text-align:left;
    border:1px solid var(--hairline);border-radius:10px;
    font-size:17px;font-weight:600;background:var(--bg);
    transition:transform 160ms var(--ease-out), background 160ms var(--ease-out);
  }
  .choice:active{background:var(--hairline-2);transform:scale(0.98)}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .context-line{margin-top:28px;font-size:13px;color:var(--ink-3)}

  /* ---- followup ---- */
  .followup{display:flex;flex-direction:column;justify-content:center;min-height:100vh;padding:48px 0}
  .followup .reason-tag{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;
    color:var(--ink-2);margin-bottom:18px;
  }
  .followup h1{margin-bottom:14px}
  .followup .sub{color:var(--ink-2);font-size:15px;margin-bottom:8px}
  .followup .alt{color:var(--ink-3);font-size:13px}
  .fu-actions{display:flex;flex-direction:column;gap:14px;margin-top:40px}
  .btn-primary{
    width:100%;padding:16px;border-radius:10px;
    background:var(--accent);color:#fff;font-size:17px;font-weight:700;
  }
  .btn-primary:active{opacity:.85}
  .btn-quiet{
    width:100%;padding:10px;font-size:14px;color:var(--ink-3);
    text-decoration:underline;text-underline-offset:3px;
  }

  /* ---- resist done ---- */
  .done{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;min-height:100vh;padding:48px 0}
  .done .big{font-size:56px;font-weight:700;color:var(--accent);line-height:1;margin-bottom:20px}
  .done h1{margin-bottom:12px}
  .done p{color:var(--ink-2)}
  .done .btn-quiet{text-align:left;padding:24px 0 0;width:auto}

  /* ---- dashboard chrome ----
     apple-design: ナビは半透明マテリアル。コンテンツが下を流れる */
  .chrome-top{
    position:sticky;top:0;z-index:10;
    margin:0 -24px;padding:0 24px;
    background:rgba(236,238,241,.78);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    backdrop-filter:blur(20px) saturate(180%);
  }
  @media (prefers-reduced-transparency: reduce){
    .chrome-top{background:var(--page-bg);-webkit-backdrop-filter:none;backdrop-filter:none}
  }
  header.top{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:20px 0 6px;
  }
  .brand-group{display:flex;align-items:center;gap:7px}
  .brand-icon{flex:none;display:block}
  .brand{font-size:15px;font-weight:700}
  .date{font-size:12px;color:var(--ink-3);letter-spacing:.06em}
  nav.tabs{display:flex;gap:20px;border-bottom:1px solid var(--hairline)}
  nav.tabs button{
    position:relative;
    padding:10px 2px;font-size:14px;font-weight:600;color:var(--ink-3);
    margin-bottom:-1px;border-radius:0;
    transition:color 160ms var(--ease-out), transform 160ms var(--ease-out);
  }
  nav.tabs button[aria-selected="true"]{color:var(--ink)}
  .tab-ink{
    position:absolute;left:0;right:0;bottom:0;height:2px;
    background:var(--accent);border-radius:2px 2px 0 0;
    view-transition-name:tab-ink;
  }
  main{padding-top:28px}

  /* View Transitions: タブ切替のクロスフェードを短く */
  ::view-transition-old(root),
  ::view-transition-new(root){animation-duration:180ms}
  ::view-transition-old(tab-ink),
  ::view-transition-new(tab-ink){animation-duration:220ms;animation-timing-function:var(--ease-out)}

  section{margin-bottom:36px}

  /* hero */
  .hero-num{font-size:56px;font-weight:700;line-height:1.05;letter-spacing:-0.02em}
  .hero-num .unit{font-size:20px;font-weight:600;color:var(--ink-2);margin-left:2px}
  .hero-sub{font-size:14px;color:var(--ink-2);margin-top:6px}
  .hero-sub .win{color:var(--good);font-weight:600}

  /* 主役の2数字。回数を最上部・最大に置き、押すと各詳細ページへ */
  .counts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .count-block{
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    padding:14px 14px 12px;border-radius:14px;text-align:left;
    background:var(--hairline-2);
    transition:background 160ms var(--ease-out), transform 160ms var(--ease-out);
  }
  .count-block:hover{background:#e9e9ee}
  .count-block:active{transform:scale(0.98)}
  .count-block .cnum{
    font-size:40px;font-weight:700;line-height:1.1;letter-spacing:-0.02em;
    color:var(--ink-2);font-variant-numeric:tabular-nums;
  }
  .count-block .cunit{font-size:17px;font-weight:600;margin-left:2px}
  .count-block .clabel{
    display:inline-flex;align-items:center;gap:3px;
    font-size:14px;font-weight:600;color:var(--ink-2);
  }
  .count-block .chev{color:var(--ink-3);font-weight:400}
  /* 引き返した＝青。開いた＝グレー（逃避の赤と衝突させない） */
  .count-block.win .cnum,
  .count-block.win .clabel{color:var(--accent)}
  .count-block.win{background:var(--accent-soft)}
  .count-block.win:hover{background:#e3edfa}
  .count-block.win .chev{color:var(--accent)}

  /* 溶けた時間は推定値なので主役から降ろす（ラベルを上・大きく、数字は小さく） */
  .melt-label{font-size:16px;font-weight:600;color:var(--ink-2);margin-bottom:2px}
  .melt-num{font-size:32px;font-weight:700;line-height:1.15;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
  .melt-num .unit{font-size:15px;font-weight:600;color:var(--ink-2);margin-left:2px}

  /* 7日間の要約 */
  .week-stats{margin-top:18px;border-top:1px solid var(--hairline-2);padding-top:6px}

  /* ---- グレー地に白カードを並べるレイアウト ---- */
  main > section{
    background:var(--bg);border-radius:16px;padding:20px 18px;margin-bottom:14px;
  }
  main > section.bare{background:transparent;padding:0}

  /* 理由につく「無意識 / 目的あり」バッジ */
  .tag{
    font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;
    white-space:nowrap;letter-spacing:.02em;
  }
  .tag.mui{background:var(--tag-red-bg);color:var(--tag-red-ink)}
  .tag.moku{background:var(--tag-blue-bg);color:var(--tag-blue-ink)}

  /* 理由行：左に色ドット＋名前＋バッジ、右に回数と分数 */
  .rsn-row{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--hairline-2)}
  .rsn-row:last-child{border-bottom:none}
  .rsn-row .name{font-size:15px;font-weight:700}
  .rsn-row .spacer{flex:1}
  .rsn-row .nums{text-align:right;line-height:1.3}
  .rsn-row .n{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .rsn-row .m{display:block;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

  /* 割合の問いかけカード */
  .challenge{
    display:flex;align-items:center;gap:14px;
    border-radius:16px;padding:18px;margin-bottom:14px;
  }
  .challenge.red{background:var(--tag-red-bg)}
  .challenge.blue{background:var(--tag-blue-bg)}
  .challenge .pct{font-size:34px;font-weight:700;line-height:1;letter-spacing:-0.02em;flex:none}
  .challenge.red .pct{color:var(--tag-red-ink)}
  .challenge.blue .pct{color:var(--tag-blue-ink)}
  .challenge .msg{font-size:14px;line-height:1.65;font-weight:600;text-wrap:pretty;word-break:auto-phrase}
  .challenge.red .msg{color:var(--tag-red-ink)}
  .challenge.blue .msg{color:var(--tag-blue-ink)}

  /* ---- 折りたたみ（見出しタップで下にスムーズに展開） ---- */
  .fold-head{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    width:100%;text-align:left;
  }
  .fold-head .arrow{
    color:var(--ink-3);font-size:13px;flex:none;
    transition:transform 320ms var(--ease-out);
  }
  .fold-head[aria-expanded="true"] .arrow{transform:rotate(90deg)}
  /* 高さをJSで実測して開閉する（fr単位のtransitionは環境差が大きいため） */
  .fold-body{overflow:hidden;height:0;transition:height 320ms var(--ease-out)}
  .fold-body > .inner{padding-top:14px}

  /* サブページ共通 */
  .back{
    display:inline-flex;align-items:center;gap:5px;
    font-size:14px;font-weight:600;color:var(--ink-3);padding:4px 0;margin-bottom:18px;
  }
  .back:hover{color:var(--accent)}
  .sub-hero{font-size:48px;font-weight:700;line-height:1.05;letter-spacing:-0.02em}
  .sub-hero .unit{font-size:18px;font-weight:600;color:var(--ink-2);margin-left:2px}
  .sub-lead{font-size:14px;color:var(--ink-2);margin-top:6px}
  .stat-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--hairline-2);font-size:14px}
  .stat-row:last-child{border-bottom:none}
  .stat-row .val{font-variant-numeric:tabular-nums;font-weight:600}

  /* ヒートマップ */
  .heat{display:grid;grid-template-columns:auto repeat(6,1fr);gap:4px;align-items:center}
  .heat .rh{font-size:12px;font-weight:600;color:var(--ink-2);padding-right:6px;white-space:nowrap;display:flex;align-items:center;gap:5px}
  .heat .ch{display:flex;flex-direction:column;align-items:center;gap:1px;padding-bottom:4px;line-height:1.3}
  .heat .ch b{font-size:12px;font-weight:700;color:var(--ink-2)}
  .heat .ch em{font-size:9px;font-style:normal;color:var(--ink-3);white-space:nowrap}
  .heat .cell{
    aspect-ratio:1;border-radius:4px;background:var(--hairline-2);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;
  }
  .heat .cell.zero{color:var(--ink-3);font-weight:400}

  /* could-have card */
  .could{
    border-left:2px solid var(--accent);
    padding:4px 0 4px 16px;
    font-size:15px;line-height:1.8;
  }
  .could em{font-style:normal;font-weight:700;color:var(--accent)}
  .could .yen{display:block;margin-top:8px;font-size:13px;color:var(--ink-3);font-weight:600}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;background:var(--hairline-2);padding:1px 5px;border-radius:4px}

  /* breakdown */
  .stackbar{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;background:var(--bg);margin-bottom:16px}
  .stackbar .seg{height:100%}
  .brk-row{
    display:flex;align-items:center;gap:10px;padding:9px 0;
    border-bottom:1px solid var(--hairline-2);font-size:14px;
  }
  .brk-row:last-child{border-bottom:none}
  .brk-row .name{flex:1;font-weight:600}
  .brk-row .val{color:var(--ink-2);font-variant-numeric:tabular-nums}

  /* trend */
  .trend{display:flex;align-items:flex-end;gap:8px;height:96px;padding-top:8px}
  .trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .trend .bar{
    width:100%;max-width:34px;border-radius:4px 4px 0 0;background:#9ec5f4;min-height:2px;
    border:none;padding:0;display:block;
    transition:background 160ms var(--ease-out);
  }
  .trend .bar.today{background:var(--accent)}
  .trend .bar:hover,
  .trend .bar.picked{background:var(--accent-deep)}
  .trend .lbl{font-size:11px;color:var(--ink-3)}
  .trend .col.picked .lbl{color:var(--ink);font-weight:700}
  /* 押せることを説明文でなく手触りで伝える：列全体がタップ領域として反応する */
  .trend .col{border-radius:6px;padding:4px 2px;cursor:pointer;transition:background 160ms var(--ease-out)}
  .trend .col:hover{background:rgba(28,92,171,.08)}
  /* 選択した日の分数はグラフの上に出す */
  .trend-readout{
    font-size:13px;color:var(--ink-3);margin-bottom:10px;min-height:1.6em;
    font-variant-numeric:tabular-nums;
  }
  .trend-readout .day{color:var(--ink-2);font-weight:600}
  .trend-readout .min{color:var(--ink);font-weight:700;font-size:15px}

  .empty{
    border:1px dashed var(--hairline);border-radius:12px;padding:28px 22px;
    color:var(--ink-2);font-size:14px;line-height:1.9;
  }
  .empty .btn-primary{margin-top:16px}

  /* per-app */
  .app-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--hairline-2);font-size:14px}
  .app-row:last-child{border-bottom:none}
  .app-row .val{color:var(--ink-2);font-variant-numeric:tabular-nums}

  /* ---- settings ---- */
  .set-card{border:1px solid var(--hairline);border-radius:12px;padding:18px;margin-bottom:14px}
  .set-card .name-line{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .set-card .name-line strong{font-size:15px}
  .del{font-size:12px;color:var(--ink-3);text-decoration:underline;text-underline-offset:2px}
  .field{margin-top:12px}
  .field label{display:block;font-size:12px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:4px}
  input[type="text"],input[type="number"]{
    width:100%;padding:10px 12px;font:inherit;font-size:15px;
    border:1px solid var(--hairline);border-radius:8px;background:var(--bg);color:var(--ink);
  }
  input[type="number"]{font-variant-numeric:tabular-nums}
  .copy-url{
    margin-top:12px;width:100%;padding:11px;border:1px solid var(--accent);
    color:var(--accent);border-radius:8px;font-size:14px;font-weight:600;background:var(--accent-soft);
  }
  .copy-url:active{opacity:.8}
  .add-btn{
    width:100%;padding:12px;border:1px dashed var(--hairline);border-radius:12px;
    color:var(--ink-2);font-size:14px;font-weight:600;
  }
  .minutes-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .minutes-grid .cell label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
  .conv-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .conv-row input[type="text"]{flex:1}
  .conv-row input[type="number"]{width:74px;flex:none}
  .conv-row .del{flex:none}
  .hint{font-size:12.5px;color:var(--ink-3);line-height:1.8;margin-top:10px}
  .danger{color:#c03535;text-decoration:underline;text-underline-offset:2px;font-size:13px}

  details.setup{border:1px solid var(--hairline);border-radius:12px;padding:0 18px}
  details.setup summary{
    padding:16px 0;font-size:14px;font-weight:700;cursor:pointer;list-style:none;
    display:flex;justify-content:space-between;align-items:center;
  }
  details.setup summary::after{content:"＋";color:var(--ink-3);font-weight:400}
  details.setup[open] summary::after{content:"－"}
  details.setup ol{padding:0 0 18px 20px;font-size:14px;color:var(--ink-2);line-height:2}
  details.setup li b{color:var(--ink)}

  .toast{
    position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%, 8px) scale(0.97);
    background:var(--ink);color:#fff;font-size:13px;font-weight:600;
    padding:9px 18px;border-radius:99px;opacity:0;pointer-events:none;
    white-space:nowrap;
    /* 退場は入場より速く */
    transition:opacity 150ms var(--ease-out), transform 150ms var(--ease-out);
  }
  .toast.show{
    opacity:1;transform:translate(-50%, 0) scale(1);
    transition-duration:200ms;
  }

  /* ---- action sheet（全消去の確認モーダル） ---- */
  .scrim{
    position:fixed;inset:0;z-index:20;background:rgba(23,23,26,.4);
    opacity:0;transition:opacity 200ms var(--ease-out);
  }
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:21;
    max-width:520px;margin:0 auto;
    background:var(--bg);border-radius:16px 16px 0 0;
    padding:24px 24px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform 320ms var(--ease-drawer);
  }
  .sheet-open .scrim{opacity:1}
  .sheet-open .sheet{transform:translateY(0)}
  .sheet-closing .scrim{opacity:0;transition-duration:200ms}
  .sheet-closing .sheet{transform:translateY(100%);transition-duration:240ms}
  .sheet h3{font-size:17px;font-weight:700;margin-bottom:6px}
  .sheet p{font-size:14px;color:var(--ink-2);margin-bottom:20px}
  .sheet .btn-destructive{
    width:100%;padding:15px;border-radius:10px;
    background:#c03535;color:#fff;font-size:16px;font-weight:700;
  }
  .sheet .btn-cancel{
    width:100%;padding:13px;margin-top:8px;
    font-size:15px;font-weight:600;color:var(--ink-2);
  }

  /* reduced motion = ゼロではなく「揺れない」。opacityは残しtransformの移動を消す */
  @media (prefers-reduced-motion: reduce){
    .screen-rise, main>section{transition:opacity 150ms ease;transform:none}
    .toast{transform:translate(-50%,0)}
    .sheet{transition:opacity 200ms ease;transform:none;opacity:0}
    .sheet-open .sheet{opacity:1}
    button:active,.choice:active{transform:none;opacity:.7}
    .fold-body{transition:none}
    .fold-head .arrow{transition:none}
  }
</style>

<div id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";

/* ================= data ================= */

/* group: 無意識＝赤系（開いた自分を疑うべき理由）／目的あり＝青系（道具として使えている理由） */
const REASONS = [
  { id:"hima",    label:"暇つぶし",   color:"var(--r-hima)",    group:"無意識"   },
  { id:"tohi",    label:"逃避",       color:"var(--r-tohi)",    group:"無意識"   },
  { id:"shirabe", label:"調べもの",   color:"var(--r-shirabe)", group:"目的あり" },
  { id:"work",    label:"勉強や仕事", color:"var(--r-work)",    group:"目的あり" },
];
const R = Object.fromEntries(REASONS.map(r=>[r.id,r]));

const DEFAULT_SETTINGS = {
  apps: [
    { id:"instagram", name:"Instagram", scheme:"instagram://" },
    { id:"x",         name:"X",         scheme:"twitter://" },
    { id:"tiktok",    name:"TikTok",    scheme:"tiktok://" },
    { id:"youtube",   name:"YouTube",   scheme:"youtube://" },
  ],
  reasonMinutes: { hima:15, tohi:20, shirabe:5, work:10 },
  graceMin: 5,
  conversions: [
    { name:"軽いアプリのプロトタイプを作る", min:60 },
    { name:"筋トレ1セット",                   min:30 },
    { name:"企業研究1社ぶん",                 min:30 },
    { name:"資格の勉強を1単元",               min:20 },
    { name:"SPIを10問",                       min:20 },
    { name:"本を20ページ読む",                min:15 },
  ],
};

const LS = {
  get(key, fallback){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} },
};

// DEFAULT_SETTINGSはディープコピーして基底にする（浅いコピーだと settings.apps が
// DEFAULT_SETTINGS.apps と同じ参照になり、スキーム編集で初期値が汚染され「全消去」が壊れる）
let settings = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), LS.get("nh_settings", {}));
settings.reasonMinutes = Object.assign({}, DEFAULT_SETTINGS.reasonMinutes, settings.reasonMinutes);
let events = LS.get("nh_events", []);           // {t, app, reason, kind:"open"|"resist"}
let lastAllowed = LS.get("nh_last", {});        // {appId: epoch ms}

function saveSettings(){ LS.set("nh_settings", settings); }
function saveEvents(){ LS.set("nh_events", events); }
function saveLast(){ LS.set("nh_last", lastAllowed); }

/* ================= helpers ================= */

const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function dayKey(t){
  const d = new Date(t);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
const todayKey = () => dayKey(Date.now());
const WD = ["日","月","火","水","木","金","土"];

function appName(id){
  const a = settings.apps.find(a=>a.id===id);
  return a ? a.name : id;
}
function estMinutes(evs){
  return evs.reduce((s,e)=> s + (e.kind==="open" && e.reason ? (settings.reasonMinutes[e.reason]||0) : 0), 0);
}
function eventsOn(key){ return events.filter(e => dayKey(e.t) === key); }

/* iOS風アクションシート。confirm()の置き換え */
function showSheet({ title, message, confirmLabel, onConfirm }){
  const wrap = document.createElement("div");
  wrap.className = "sheet-wrap";
  wrap.innerHTML = `
    <div class="scrim"></div>
    <div class="sheet" role="alertdialog" aria-modal="true" aria-label="${esc(title)}">
      <h3>${esc(title)}</h3>
      <p>${esc(message)}</p>
      <button class="btn-destructive">${esc(confirmLabel)}</button>
      <button class="btn-cancel">キャンセル</button>
    </div>`;
  document.body.appendChild(wrap);

  const close = () => {
    wrap.classList.remove("sheet-open");
    wrap.classList.add("sheet-closing");
    document.removeEventListener("keydown", onKey);
    // 退場（240ms）が終わってから片付ける
    setTimeout(()=> wrap.remove(), 280);
  };
  const onKey = e => { if(e.key === "Escape") close(); };

  wrap.querySelector(".scrim").addEventListener("click", close);
  wrap.querySelector(".btn-cancel").addEventListener("click", close);
  wrap.querySelector(".btn-destructive").addEventListener("click", ()=>{ close(); onConfirm(); });
  document.addEventListener("keydown", onKey);

  // 挿入フレームの後にクラスを付けてtransitionを発火させる
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    wrap.classList.add("sheet-open");
    wrap.querySelector(".btn-cancel").focus();
  }));
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> el.classList.remove("show"), 1800);
}

/* 「本来なら」換算文 */
function couldHaveText(totalMin){
  const items = [...settings.conversions].sort((a,b)=>b.min-a.min).filter(c=>c.min>0);
  let rest = totalMin;
  const done = [];
  for(const it of items){
    if(done.length >= 2) break;
    const n = Math.floor(rest / it.min);
    if(n >= 1){
      // 「〜を作る」のような項目名だと「を」が重複するので括弧書きにする
      done.push(n > 1 ? `${it.name}（${n}回ぶん）` : it.name);
      rest -= n * it.min;
    }
  }
  return done;
}

/* ================= intercept flow ================= */

function renderIntercept(appId){
  const name = appName(appId);
  const todayEvs = eventsOn(todayKey()).filter(e=>e.app===appId);
  const nth = todayEvs.filter(e=>e.kind==="open").length + 1;
  const todayAll = eventsOn(todayKey());
  const min = estMinutes(todayAll);
  const ctx = nth === 1
    ? "今日はじめての起動。"
    : `今日${nth}回目。ここまでSNS全体で推定${min}分。`;

  $app.innerHTML = `
    <div class="intercept">
      <p class="eyebrow">${esc(name.toUpperCase())} を開こうとしています</p>
      <h1>なんで開いたの？</h1>
      <div class="choices">
        ${REASONS.map(r=>`
          <button class="choice" data-reason="${r.id}">
            <span class="dot" style="background:${r.color}"></span>${r.label}
          </button>`).join("")}
      </div>
      <p class="context-line">${esc(ctx)}</p>
    </div>`;

  $app.querySelectorAll(".choice").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const reason = btn.dataset.reason;
      // 先に「開いた」として記録。やめておくを選んだら resist に昇格する
      events.push({ t: Date.now(), app: appId, reason, kind:"open" });
      saveEvents();
      renderFollowup(appId, reason);
    });
  });
}

const FU = {
  hima: {
    line: "暇なら、それは自由時間ってこと。",
    sub:  "スクロールに払う？それとも自分に使う？",
    stay: true,
  },
  tohi: {
    line: "何から逃げてる？",
    sub:  "開いても、それは消えないよ。",
    stay: true,
  },
  shirabe: {
    line: "OK、調べものだね。",
    sub:  "目的のものだけ調べて、終わったら閉じよう。",
    stay: false,
  },
  work: {
    line: "了解、道具として使おう。",
    sub:  "脱線しはじめたら、それは「暇つぶし」。",
    stay: false,
  },
};

function renderFollowup(appId, reason){
  const fu = FU[reason];
  const r = R[reason];
  const m = settings.reasonMinutes[reason] || 0;
  const alt = couldHaveText(m);
  const altLine = (fu.stay && alt.length)
    ? `いつもの1回ぶん（約${m}分）があれば、${alt.join("と")}ができる。` : "";

  const openBtn  = `<button class="${fu.stay ? "btn-quiet" : "btn-primary"}" id="go">それでも開く</button>`;
  const stayBtn  = `<button class="${fu.stay ? "btn-primary" : "btn-quiet"}" id="stay">やめておく</button>`;

  $app.innerHTML = `
    <div class="followup screen-rise">
      <span class="reason-tag"><span class="dot" style="background:${r.color}"></span>${r.label}</span>
      <h1>${esc(fu.line)}</h1>
      <p class="sub">${esc(fu.sub)}</p>
      ${altLine ? `<p class="alt">${esc(altLine)}</p>` : ""}
      <div class="fu-actions">
        ${fu.stay ? stayBtn + openBtn : openBtn + stayBtn}
      </div>
    </div>`;

  document.getElementById("go").addEventListener("click", ()=> allowAndOpen(appId));
  document.getElementById("stay").addEventListener("click", ()=>{
    const last = events[events.length-1];
    if(last && last.app===appId && last.kind==="open") last.kind = "resist";
    saveEvents();
    renderResistDone();
  });
}

/* 通行証: SNSに戻る直前にクリップボードへ書く。オートメーション側が
   これを見つけたら「消して何もしない」ことで再発火ループを切る */
function writePass(then){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText("togame-pass").then(then, then);
  }else{
    then();
  }
}

function allowAndOpen(appId){
  lastAllowed[appId] = Date.now();
  saveLast();
  const a = settings.apps.find(a=>a.id===appId);
  writePass(()=>{
    if(a && a.scheme){
      location.href = a.scheme;
    }else{
      $app.innerHTML = `<div class="done screen-rise"><h1>どうぞ。</h1><p>ホームに戻って${esc(appName(appId))}を開いてOK。${settings.graceMin}分間は引き止めない。</p></div>`;
    }
  });
}

function renderResistDone(){
  const wins = eventsOn(todayKey()).filter(e=>e.kind==="resist").length;
  $app.innerHTML = `
    <div class="done screen-rise">
      <div class="big">${wins}</div>
      <h1>引き返した。今日${wins}回目のえらい。</h1>
      <p>このままホーム画面に戻ろう。</p>
      <button class="btn-quiet" id="to-dash">今日のまとめを見る →</button>
    </div>`;
  document.getElementById("to-dash").addEventListener("click", ()=>{
    history.replaceState(null,"",location.pathname);
    swap(renderDashboard);
  });
}

/* ================= dashboard ================= */

/* タブ切替はView Transitionsでクロスフェード＋下線スライド（未対応・reduced motionなら即時） */
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
function swap(renderFn){
  if(document.startViewTransition && !reduceMotion.matches){
    document.startViewTransition(renderFn);
  }else{
    renderFn();
  }
}

function chrome(active, inner){
  const d = new Date();
  const tab = (id,label) => `
    <button role="tab" aria-selected="${active===id}" data-tab="${id}">
      ${label}${active===id ? '<span class="tab-ink"></span>' : ""}
    </button>`;
  $app.innerHTML = `
    <div class="chrome-top">
      <header class="top">
        <span class="brand-group">
          <svg class="brand-icon" width="24" height="24" viewBox="0 0 32 32" aria-hidden="true">
            <ellipse cx="6" cy="10" rx="3" ry="2.2" fill="#2f8f5b" transform="rotate(-30 6 10)"/>
            <ellipse cx="26" cy="10" rx="3" ry="2.2" fill="#2f8f5b" transform="rotate(30 26 10)"/>
            <ellipse cx="6" cy="23" rx="3" ry="2.2" fill="#2f8f5b" transform="rotate(30 6 23)"/>
            <ellipse cx="26" cy="23" rx="3" ry="2.2" fill="#2f8f5b" transform="rotate(-30 26 23)"/>
            <path d="M16 29 L13.3 24.6 L18.7 24.6 Z" fill="#2f8f5b"/>
            <circle cx="16" cy="5.2" r="3.4" fill="#2f8f5b"/>
            <circle cx="14.8" cy="4.5" r="0.55" fill="#0b3d21"/>
            <circle cx="17.2" cy="4.5" r="0.55" fill="#0b3d21"/>
            <circle cx="16" cy="17" r="12" fill="#146b3a"/>
            <circle cx="16" cy="17" r="9" fill="#f2fbf6"/>
            <g stroke="#12321f" stroke-width="1.1" stroke-linecap="round">
              <line x1="16" y1="9.2" x2="16" y2="10.6"/>
              <line x1="16" y1="23.4" x2="16" y2="24.8"/>
              <line x1="8.2" y1="17" x2="9.6" y2="17"/>
              <line x1="22.4" y1="17" x2="23.8" y2="17"/>
            </g>
            <line x1="16" y1="17" x2="16" y2="12" stroke="#12321f" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="16" y1="17" x2="19.4" y2="15.1" stroke="#12321f" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="16" cy="17" r="1" fill="#12321f"/>
          </svg>
          <span class="brand">トガメ</span>
        </span>
        <span class="date">${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）</span>
      </header>
      <nav class="tabs" role="tablist">
        ${tab("today","今日")}${tab("settings","設定")}
      </nav>
    </div>
    <main>${inner}</main>`;
  $app.querySelectorAll("nav.tabs button").forEach(b=>{
    b.addEventListener("click", ()=>{
      if(b.dataset.tab === active) return;
      swap(()=> b.dataset.tab==="today" ? renderDashboard() : renderSettings());
    });
  });
}

function renderDashboard(){
  const evs = eventsOn(todayKey());
  if(events.length === 0){ return renderEmpty(); }

  const opens   = evs.filter(e=>e.kind==="open").length;
  const resists = evs.filter(e=>e.kind==="resist").length;
  const total   = estMinutes(evs);

  /* 換算文 */
  const could = couldHaveText(total);
  const couldHtml = total < 5
    ? `今日はまだほとんど時間を失っていない。<em>この調子。</em>`
    : (could.length
        ? `この時間があれば、<em>${could.map(esc).join("</em>と<em>")}</em>ができました。`
        : `この時間で、できたことがあったはず。`);

  /* 理由別内訳 */
  const byReason = REASONS.map(r=>{
    const n = evs.filter(e=>e.kind==="open" && e.reason===r.id).length;
    return { ...r, n, min: n * (settings.reasonMinutes[r.id]||0) };
  });
  const sumMin = byReason.reduce((s,b)=>s+b.min,0) || 1;
  const segs = byReason.filter(b=>b.min>0);

  /* いちばん多い理由の割合。無意識系が最多なら問い詰め、目的あり系なら肯定する */
  const top = byReason.reduce((a,b)=> b.n > a.n ? b : a, byReason[0]);
  const topPct = opens ? Math.round(top.n / opens * 100) : 0;
  const isMui = top.group === "無意識";
  const challengeHtml = opens && top.n > 0 ? `
    <div class="challenge ${isMui ? "red" : "blue"}">
      <span class="pct">${topPct}%</span>
      <span class="msg">が「${esc(top.label)}」。${
        isMui
          ? `その${top.min}分、本当に必要だった？`
          : `目的があって開けている。`
      }</span>
    </div>` : "";

  /* アプリ別 */
  const byApp = {};
  evs.filter(e=>e.kind==="open").forEach(e=>{ byApp[e.app]=(byApp[e.app]||0)+1; });

  /* 7日間 */
  const days = [];
  for(let i=6;i>=0;i--){
    const t = Date.now() - i*86400000;
    const key = dayKey(t);
    days.push({ key, wd: WD[new Date(t).getDay()], min: estMinutes(eventsOn(key)), today: i===0 });
  }
  const maxMin = Math.max(...days.map(d=>d.min), 30);

  /* 7日間の要約（グラフだけだと情報が薄いので平均などを添える） */
  const weekTotal = days.reduce((s,d)=>s+d.min, 0);
  const weekAvg   = Math.round(weekTotal / 7);
  const peak      = days.reduce((a,b)=> b.min > a.min ? b : a, days[0]);
  // 前の7日間（8〜14日前）と比べる
  let prevTotal = 0;
  for(let i=13;i>=7;i--) prevTotal += estMinutes(eventsOn(dayKey(Date.now() - i*86400000)));
  const prevAvg = Math.round(prevTotal / 7);
  const diff = weekAvg - prevAvg;
  const diffText = prevTotal === 0
    ? "—"
    : (diff > 0 ? `+${diff}分 増えた` : diff < 0 ? `${Math.abs(diff)}分 減った` : "変わらず");

  /* 初期表示から今日の分数を出しておく（説明文なしで押せると伝わるように） */
  const td = days[days.length-1];
  const [,tm,tdd] = td.key.split("-");
  const initReadout = `<span class="day">${Number(tm)}/${Number(tdd)}（${td.wd}）</span> <span class="min">${td.min}分</span>`;

  chrome("today", `
    <section>
      <div class="counts">
        <button class="count-block" id="to-heat">
          <span class="cnum">${opens}<span class="cunit">回</span></span>
          <span class="clabel">開いた<span class="chev">›</span></span>
        </button>
        <button class="count-block win" id="to-recovered">
          <span class="cnum">${resists}<span class="cunit">回</span></span>
          <span class="clabel">引き返した<span class="chev">›</span></span>
        </button>
      </div>
    </section>

    <section>
      <p class="melt-label">SNSに溶けた推定時間</p>
      <div class="melt-num">${total}<span class="unit">分</span></div>
    </section>

    ${challengeHtml}

    <section>
      <div class="could">${couldHtml}</div>
    </section>

    ${segs.length ? `
    <section>
      <h2>なぜ開いた？</h2>
      <div class="stackbar" role="img" aria-label="理由の内訳バー">
        ${segs.map(b=>`<div class="seg" style="width:${(b.min/sumMin*100).toFixed(1)}%;background:${b.color}"></div>`).join("")}
      </div>
      ${byReason.filter(b=>b.n>0).map(b=>`
        <div class="rsn-row">
          <span class="dot" style="background:${b.color}"></span>
          <span class="name">${b.label}</span>
          <span class="tag ${b.group === "無意識" ? "mui" : "moku"}">${b.group}</span>
          <span class="spacer"></span>
          <span class="nums">
            <span class="n" style="color:${b.color}">${b.n}回</span>
            <span class="m">推定${b.min}分</span>
          </span>
        </div>`).join("")}
    </section>` : ""}

    ${Object.keys(byApp).length ? `
    <section>
      <button class="fold-head" id="fold-app" aria-expanded="false" aria-controls="body-app">
        <h2 style="margin:0">アプリ別</h2><span class="arrow">›</span>
      </button>
      <div class="fold-body" id="body-app"><div class="inner">
        ${Object.entries(byApp).sort((a,b)=>b[1]-a[1]).map(([id,n])=>`
          <div class="app-row"><span>${esc(appName(id))}</span><span class="val">${n}回</span></div>`).join("")}
      </div></div>
    </section>` : ""}

    <section>
      <button class="fold-head" id="fold-week" aria-expanded="false" aria-controls="body-week">
        <h2 style="margin:0">この7日間</h2><span class="arrow">›</span>
      </button>
      <div class="fold-body" id="body-week"><div class="inner">
        <p class="trend-readout" id="trend-cap" aria-live="polite">${initReadout}</p>
        <div class="trend">
          ${days.map((d,i)=>`
            <div class="col${d.today?" picked":""}">
              <button class="bar${d.today?" today picked":""}" data-i="${i}"
                style="height:${Math.max(2, d.min/maxMin*100).toFixed(1)}%"
                aria-label="${d.key} 推定${d.min}分"></button>
              <span class="lbl">${d.today ? "今日" : d.wd}</span>
            </div>`).join("")}
        </div>
        <div class="week-stats">
          <div class="stat-row"><span>1日の平均</span><span class="val">${weekAvg}分</span></div>
          <div class="stat-row"><span>7日間の合計</span><span class="val">${weekTotal}分</span></div>
          <div class="stat-row"><span>いちばん多い日</span><span class="val">${peak.min > 0 ? `${peak.today ? "今日" : peak.wd+"曜"} ・ ${peak.min}分` : "—"}</span></div>
          <div class="stat-row"><span>先週の平均から</span><span class="val">${diffText}</span></div>
        </div>
      </div></div>
    </section>
  `);

  const heatBtn = document.getElementById("to-heat");
  if(heatBtn) heatBtn.addEventListener("click", ()=> swap(renderHeatmap));
  const recBtn = document.getElementById("to-recovered");
  if(recBtn) recBtn.addEventListener("click", ()=> swap(renderRecovered));

  // 見出しタップで下に展開する折りたたみ。開ききったらautoにして中身の変化に追従させる
  [["fold-app","body-app"], ["fold-week","body-week"]].forEach(([hid,bid])=>{
    const head = document.getElementById(hid), body = document.getElementById(bid);
    if(!head || !body) return;
    const inner = body.querySelector(".inner");
    head.addEventListener("click", ()=>{
      const open = body.classList.toggle("open");
      head.setAttribute("aria-expanded", String(open));
      // 実測値と0pxの往復だけで完結させる（autoを挟むと環境によって開かないため）
      body.style.height = open ? inner.offsetHeight + "px" : "0px";
    });
  });

  // 列全体をタップ領域にする（細いバーだけだと押しづらいため）
  $app.querySelectorAll(".trend .col").forEach(col=>{
    col.addEventListener("click", ()=>{
      const bar = col.querySelector(".bar");
      const d = days[Number(bar.dataset.i)];
      const [,m,dd] = d.key.split("-");
      // 選択中の日を目立たせる（前の選択は解除）
      $app.querySelectorAll(".trend .bar.picked").forEach(b=>b.classList.remove("picked"));
      $app.querySelectorAll(".trend .col.picked").forEach(c=>c.classList.remove("picked"));
      bar.classList.add("picked");
      col.classList.add("picked");
      document.getElementById("trend-cap").innerHTML =
        `<span class="day">${Number(m)}/${Number(dd)}（${d.wd}）</span> <span class="min">${d.min}分</span>`;
    });
  });
}

/* ================= サブページ ================= */

/* 引き返した回数 × その理由の分数 = 守りきった時間。
   スクリーンタイムでは原理的に測れない（開いていないので記録が残らない）数字 */
function recoveredMin(evs){
  return evs.reduce((s,e)=> s + (e.kind==="resist" && e.reason ? (settings.reasonMinutes[e.reason]||0) : 0), 0);
}

function renderRecovered(){
  const today = eventsOn(todayKey());
  const todayMin = recoveredMin(today);

  // 直近7日
  let weekMin = 0, weekCount = 0;
  for(let i=0;i<7;i++){
    const evs = eventsOn(dayKey(Date.now() - i*86400000));
    weekMin += recoveredMin(evs);
    weekCount += evs.filter(e=>e.kind==="resist").length;
  }
  const allMin   = recoveredMin(events);
  const allCount = events.filter(e=>e.kind==="resist").length;

  const could = couldHaveText(todayMin);
  const couldHtml = todayMin > 0 && could.length
    ? `この時間で、<em>${could.map(esc).join("</em>と<em>")}</em>ができる。`
    : `引き返すたび、ここに時間が積み上がる。`;

  /* 理由別の内訳 */
  const byReason = REASONS.map(r=>{
    const n = today.filter(e=>e.kind==="resist" && e.reason===r.id).length;
    return { ...r, n, min: n * (settings.reasonMinutes[r.id]||0) };
  }).filter(b=>b.n>0);

  chrome("today", `
    <button class="back" id="back-home">‹ 今日</button>
    <section>
      <p class="eyebrow">取り戻した時間</p>
      <div class="sub-hero">${todayMin}<span class="unit">分</span></div>
      <p class="sub-lead">今日、開かずに済ませた時間</p>
    </section>

    <section>
      <div class="could">${couldHtml}</div>
    </section>

    ${byReason.length ? `
    <section>
      <h2>引き返した理由</h2>
      ${byReason.map(b=>`
        <div class="brk-row">
          <span class="dot" style="background:${b.color}"></span>
          <span class="name">${b.label}</span>
          <span class="val">${b.n}回 ・ ${b.min}分</span>
        </div>`).join("")}
    </section>` : ""}

    <section>
      <h2>これまで</h2>
      <div class="stat-row"><span>この7日間</span><span class="val">${weekCount}回 ・ ${weekMin}分</span></div>
      <div class="stat-row"><span>累計</span><span class="val">${allCount}回 ・ ${allMin}分</span></div>
    </section>
  `);

  document.getElementById("back-home").addEventListener("click", ()=> swap(renderDashboard));
}

/* 時間帯 × 理由。いつ・どの理由で負けやすいかを出す */
const HEAT_BUCKETS = [
  { label:"深夜", hours:"0〜3時",   from:0,  to:3  },
  { label:"早朝", hours:"4〜7時",   from:4,  to:7  },
  { label:"午前", hours:"8〜11時",  from:8,  to:11 },
  { label:"昼",   hours:"12〜15時", from:12, to:15 },
  { label:"夕方", hours:"16〜19時", from:16, to:19 },
  { label:"夜",   hours:"20〜23時", from:20, to:23 },
];

function renderHeatmap(){
  // 直近7日ぶんを対象にする（1日だとマスが埋まらないため）
  const since = Date.now() - 7*86400000;
  const opens = events.filter(e=>e.kind==="open" && e.t >= since && e.reason);

  const grid = {};
  let max = 0, topCell = null;
  REASONS.forEach(r=>{
    grid[r.id] = HEAT_BUCKETS.map(()=>0);
  });
  opens.forEach(e=>{
    const h = new Date(e.t).getHours();
    const bi = HEAT_BUCKETS.findIndex(b => h >= b.from && h <= b.to);
    if(bi < 0 || !grid[e.reason]) return;
    const v = ++grid[e.reason][bi];
    if(v > max){ max = v; topCell = { reason:e.reason, bi }; }
  });

  chrome("today", `
    <button class="back" id="back-home">‹ 今日</button>
    <section>
      <h2>いつ開いてる？</h2>
      <div class="heat">
        <span></span>
        ${HEAT_BUCKETS.map(b=>`<span class="ch"><b>${b.label}</b><em>${b.hours}</em></span>`).join("")}
        ${REASONS.map(r=>`
          <span class="rh"><span class="dot" style="background:${r.color}"></span>${r.label}</span>
          ${grid[r.id].map((v,bi)=>`
            <span class="cell${v?"":" zero"}"
              style="${v?`background:${r.color};opacity:${(0.25 + 0.75*v/max).toFixed(2)}`:""}"
              title="${HEAT_BUCKETS[bi].hours} ${r.label} ${v}回">${v||""}</span>`).join("")}
        `).join("")}
      </div>
    </section>
  `);

  document.getElementById("back-home").addEventListener("click", ()=> swap(renderDashboard));
}

        まだ記録がない。<br>

/* ================= settings ================= */

function interceptUrl(appId){
  return location.origin + location.pathname + "?app=" + encodeURIComponent(appId);
}

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast("コピーした"), ()=>window.prompt("手動でコピーして:", text));
  }else{
    window.prompt("手動でコピーして:", text);
  }
}

function renderSettings(){
  chrome("settings", `
    <section>
      <h2>監視するアプリ</h2>
      <p class="hint" style="margin:0 0 14px">
        トガメが問い詰める相手。各アプリの<b>「URLをコピー」</b>を押して、iPhoneの「ショートカット」アプリのオートメーション<b>「Appが開かれたとき → URLを開く」</b>に貼ると、そのSNSを開くたびトガメが出る。<br>
        <b>URLスキーム</b>（例: <code>instagram://</code>）は、問い詰めのあと元のSNSへ戻る入口。分からなければ空でOK。
      </p>
      <div id="apps">
        ${settings.apps.map((a,i)=>`
          <div class="set-card">
            <div class="name-line">
              <strong>${esc(a.name)}</strong>
              <button class="del" data-del="${i}">削除</button>
            </div>
            <button class="copy-url" data-copy="${i}">${esc(a.name)}用のURLをコピー</button>
            <div class="field">
              <label>URLスキーム（元のSNSに戻る入口）</label>
              <input type="text" data-scheme="${i}" value="${esc(a.scheme)}" placeholder="instagram://">
            </div>
          </div>`).join("")}
      </div>
      <button class="add-btn" id="add-app">＋ アプリを追加</button>
    </section>

    <section>
      <h2>1回開いたら何分溶ける？</h2>
      <div class="minutes-grid">
        ${REASONS.map(r=>`
          <div class="cell">
            <label for="min-${r.id}"><span class="dot" style="background:${r.color}"></span>${r.label}</label>
            <input type="number" id="min-${r.id}" data-rmin="${r.id}" value="${settings.reasonMinutes[r.id]}" min="0" max="180" inputmode="numeric">
          </div>`).join("")}
      </div>
    </section>

    <section>
      <h2>引き止めない時間</h2>
      <div class="field">
        <label for="grace">「それでも開く」を選んだあと、再質問しない時間（分）</label>
        <input type="number" id="grace" value="${settings.graceMin}" min="1" max="120" inputmode="numeric">
      </div>
    </section>

    <section>
      <h2>その時間でできたはずのこと</h2>
      <div id="convs">
        ${settings.conversions.map((c,i)=>`
          <div class="conv-row">
            <input type="text" data-cname="${i}" value="${esc(c.name)}">
            <input type="number" data-cmin="${i}" value="${c.min}" min="1" max="600" inputmode="numeric" aria-label="所要分数">
            <button class="del" data-cdel="${i}">削除</button>
          </div>`).join("")}
      </div>
      <button class="add-btn" id="add-conv">＋ 項目を追加</button>
    </section>

    <section>
      <h2>データ</h2>
      <p style="display:flex;gap:18px">
        <button class="del" id="export">エクスポート</button>
        <button class="del" id="import">インポート</button>
        <button class="danger" id="wipe">全消去</button>
      </p>
    </section>
  `);

  /* apps */
  $app.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click", ()=>{
    settings.apps.splice(Number(b.dataset.del),1); saveSettings(); renderSettings();
  }));
  $app.querySelectorAll("[data-scheme]").forEach(inp=>inp.addEventListener("change", ()=>{
    settings.apps[Number(inp.dataset.scheme)].scheme = inp.value.trim(); saveSettings();
  }));
  $app.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click", ()=>{
    copyText(interceptUrl(settings.apps[Number(b.dataset.copy)].id));
  }));
  document.getElementById("add-app").addEventListener("click", e=>{
    const form = document.createElement("div");
    form.className = "set-card screen-rise";
    form.innerHTML = `
      <div class="field" style="margin-top:0">
        <label>アプリ名（例: Instagram）</label>
        <input type="text" id="new-app-name" autocomplete="off">
      </div>
      <button class="copy-url" id="new-app-save">追加する</button>`;
    e.currentTarget.replaceWith(form);
    const input = form.querySelector("#new-app-name");
    input.focus();
    form.querySelector("#new-app-save").addEventListener("click", ()=>{
      const name = input.value.trim();
      if(!name) { input.focus(); return; }
      const id = name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "app"+Date.now();
      settings.apps.push({ id, name, scheme:"" });
      saveSettings(); renderSettings(); toast("追加した。URLスキームも入れてね");
    });
  });

  /* minutes & grace */
  $app.querySelectorAll("[data-rmin]").forEach(inp=>inp.addEventListener("change", ()=>{
    settings.reasonMinutes[inp.dataset.rmin] = Math.max(0, Number(inp.value)||0); saveSettings();
  }));
  document.getElementById("grace").addEventListener("change", e=>{
    settings.graceMin = Math.max(1, Number(e.target.value)||5); saveSettings();
  });

  /* conversions */
  $app.querySelectorAll("[data-cname]").forEach(inp=>inp.addEventListener("change", ()=>{
    settings.conversions[Number(inp.dataset.cname)].name = inp.value.trim(); saveSettings();
  }));
  $app.querySelectorAll("[data-cmin]").forEach(inp=>inp.addEventListener("change", ()=>{
    settings.conversions[Number(inp.dataset.cmin)].min = Math.max(1, Number(inp.value)||1); saveSettings();
  }));
  $app.querySelectorAll("[data-cdel]").forEach(b=>b.addEventListener("click", ()=>{
    settings.conversions.splice(Number(b.dataset.cdel),1); saveSettings(); renderSettings();
  }));
  document.getElementById("add-conv").addEventListener("click", ()=>{
    settings.conversions.push({ name:"新しい項目", min:30 });
    saveSettings(); renderSettings();
  });

  /* data */
  document.getElementById("export").addEventListener("click", ()=>{
    copyText(JSON.stringify({ settings, events }, null, 2));
  });
  document.getElementById("import").addEventListener("click", ()=>{
    const text = window.prompt("エクスポートしたJSONを貼り付けて:");
    if(!text) return;
    let data;
    try{ data = JSON.parse(text); }
    catch(e){ toast("JSONが読めなかった"); return; }
    if(data && data.settings){
      settings = Object.assign({}, DEFAULT_SETTINGS, data.settings);
      settings.reasonMinutes = Object.assign({}, DEFAULT_SETTINGS.reasonMinutes, data.settings.reasonMinutes || {});
      saveSettings();
    }
    if(data && Array.isArray(data.events)){ events = data.events; saveEvents(); }
    toast("読み込んだ");
    renderSettings();
  });
  document.getElementById("wipe").addEventListener("click", ()=>{
    showSheet({
      title: "記録と設定を全部消す",
      message: "元に戻せない。それでもいい？",
      confirmLabel: "全部消す",
      onConfirm(){
        localStorage.removeItem("nh_events");
        localStorage.removeItem("nh_settings");
        localStorage.removeItem("nh_last");
        settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
        events = []; lastAllowed = {};
        toast("全部消した");
        swap(renderDashboard);
      },
    });
  });
}

/* 猶予時間内の再訪問: 自動リダイレクトはしない（毎回iOSの確認ダイアログが
   出て無限ループになるため）。静かな画面を出し、戻るのはユーザー操作に任せる */
function renderGrace(appId){
  const a = settings.apps.find(a=>a.id===appId);
  const backBtn = (a && a.scheme)
    ? `<button class="btn-quiet" id="back">${esc(appName(appId))}に戻る →</button>` : "";
  $app.innerHTML = `
    <div class="done screen-rise">
      <h1>さっき答えたばかり。</h1>
      <p>あと${settings.graceMin}分は引き止めない。そのまま${esc(appName(appId))}を使ってOK。</p>
      ${backBtn}
    </div>`;
  const b = document.getElementById("back");
  if(b) b.addEventListener("click", ()=>{ writePass(()=>{ location.href = a.scheme; }); });
}

/* ================= router ================= */

(function main(){
  const p = new URLSearchParams(location.search);
  const appId = p.get("app");
  if(appId){
    const allowed = lastAllowed[appId];
    if(allowed && Date.now() - allowed < settings.graceMin * 60000){
      renderGrace(appId);
    }else{
      renderIntercept(appId);
    }
  }else{
    renderDashboard();
  }
})();
</script>
