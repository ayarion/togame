<meta charset="utf-8">
<title>トガメ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='6' cy='10' rx='3' ry='2.2' fill='%232f8f5b' transform='rotate(-30 6 10)'/%3E%3Cellipse cx='26' cy='10' rx='3' ry='2.2' fill='%232f8f5b' transform='rotate(30 26 10)'/%3E%3Cellipse cx='6' cy='23' rx='3' ry='2.2' fill='%232f8f5b' transform='rotate(30 6 23)'/%3E%3Cellipse cx='26' cy='23' rx='3' ry='2.2' fill='%232f8f5b' transform='rotate(-30 26 23)'/%3E%3Cpath d='M16 29 L13.3 24.6 L18.7 24.6 Z' fill='%232f8f5b'/%3E%3Ccircle cx='16' cy='5.2' r='3.4' fill='%232f8f5b'/%3E%3Ccircle cx='14.8' cy='4.5' r='0.55' fill='%230b3d21'/%3E%3Ccircle cx='17.2' cy='4.5' r='0.55' fill='%230b3d21'/%3E%3Ccircle cx='16' cy='17' r='12' fill='%23146b3a'/%3E%3Ccircle cx='16' cy='17' r='9' fill='%23f2fbf6'/%3E%3Cg stroke='%2312321f' stroke-width='1.1' stroke-linecap='round'%3E%3Cline x1='16' y1='9.2' x2='16' y2='10.6'/%3E%3Cline x1='16' y1='23.4' x2='16' y2='24.8'/%3E%3Cline x1='8.2' y1='17' x2='9.6' y2='17'/%3E%3Cline x1='22.4' y1='17' x2='23.8' y2='17'/%3E%3C/g%3E%3Cline x1='16' y1='17' x2='16' y2='12' stroke='%2312321f' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='16' y1='17' x2='19.4' y2='15.1' stroke='%2312321f' stroke-width='1.5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='17' r='1' fill='%2312321f'/%3E%3C/svg%3E">

<!-- 介入フロー（問い詰め・返し・引き返した・素通り）だけで使う書体。
     ダッシュボード/設定はシステムフォントのまま変えていない -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    /* ダッシュボード/設定も介入フローと同じReplit系パレットに揃える。
       変数名は既存のまま残し、値だけ差し替えることで、下の何百行もの
       ルールを1つずつ書き換えずに済ませている */
    --bg:#ffffff;              /* Pure White */
    --page-bg:#faf6f1;         /* Warm Canvas */
    --ink:#0e0e0f;             /* Ink Black */
    --ink-2:#52545a;           /* Pewter */
    --ink-3:#8f9096;           /* Pewterを少し明るくした版 */
    --hairline:#dfddd8;        /* Sand */
    --hairline-2:#ece9e3;      /* Sandを少し明るくした版 */
    /* accentは「引き返した＝安全な選択」を指す色として、介入フローの
       やめておくボタンと同じElectric Blueの系統にする。Ember Orangeは
       介入フロー側で衝動/警戒の意味を背負っているので、ここでは使わない。
       ただし素のElectric Blue #2492ffは白地の小さな文字だと3.17:1しか
       出ず、タブの文字やカードのラベルなど本文サイズで使う箇所が多いので
       濃くしたトーンを基準値にする（5.6:1、装飾用に-soft/-brightを別で持つ） */
    --accent:#1668b8;
    --accent-deep:#0d4d8f;
    --accent-soft:#e8f2ff;
    --accent-bright:#2492ff;
    /* 理由は2系統4色のまま。無意識＝赤系（Ember/Burnt Rust）／目的あり＝
       青系（Electric Blueの濃淡）。ただしダッシュボードではこの色を
       ドットや棒グラフの塗りだけでなく白文字の下地（ヒートマップ）にも
       使うため、介入フローの鮮やかな値そのままだと白文字が3.6:1前後
       までしか出ない。ここだけ少し沈めて4.5:1以上を確保する */
    --r-hima:#d43600;
    --r-tohi:#a82f00;
    --r-shirabe:#1668b8;
    --r-work:#3d6ea8;
    --tag-red-bg:#ffe4d9;
    --tag-red-ink:#a82c00;
    --tag-blue-bg:#e8f2ff;
    --tag-blue-ink:#1668b8;
    --good:#1668b8;
    --font-ui:'Inter','Noto Sans JP','Hiragino Sans','Yu Gothic UI','Segoe UI',sans-serif;
    /* animations.dev: 標準イージングは弱いのでカスタムカーブを使う */
    --ease-out:cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out:cubic-bezier(0.77, 0, 0.175, 1);
    --ease-drawer:cubic-bezier(0.32, 0.72, 0, 1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--page-bg)}
  body{
    font-family:var(--font-ui);
    color:var(--ink);
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:520px;margin:0 auto;padding:0 24px calc(48px + env(safe-area-inset-bottom));min-height:100vh}

  .eyebrow{
    font-size:12px;letter-spacing:.14em;color:var(--ink-3);
    font-weight:600;
  }
  h1{font-size:28px;font-weight:700;line-height:1.35;letter-spacing:-0.01em;text-wrap:balance;word-break:auto-phrase}
  h2{font-size:17px;font-weight:500;letter-spacing:-0.02em;color:var(--ink);margin-bottom:14px}

  button{
    font:inherit;color:inherit;background:none;border:none;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    /* apple-design: フィードバックはpointer-downの瞬間に。transformのみ遷移させる */
    transition:transform 160ms var(--ease-out);
  }
  button:active{transform:scale(0.97)}
  button:focus-visible,input:focus-visible,details summary:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;
  }

  /* ---- 入場アニメーション ----
     頻度で強度を変える（animations.dev）:
     問い詰め画面=毎日何十回→フェードのみ150ms / 選択後の画面=250msのrise */
  .intercept{
    opacity:1;
    transition:opacity 150ms var(--ease-out);
  }
  @starting-style{
    .intercept{opacity:0}
  }
  .screen-rise{
    opacity:1;transform:translateY(0);
    transition:opacity 250ms var(--ease-out), transform 250ms var(--ease-out);
  }
  @starting-style{
    .screen-rise{opacity:0;transform:translateY(8px)}
  }
  main>section{
    opacity:1;transform:translateY(0);
    transition:opacity 300ms var(--ease-out), transform 300ms var(--ease-out);
  }
  main>section:nth-of-type(2){transition-delay:40ms}
  main>section:nth-of-type(3){transition-delay:80ms}
  main>section:nth-of-type(4){transition-delay:120ms}
  main>section:nth-of-type(5){transition-delay:160ms}
  main>section:nth-of-type(6){transition-delay:200ms}
  @starting-style{
    main>section{opacity:0;transform:translateY(8px)}
  }

  /* ---- 介入フロー（問い詰め・返し・引き返した・素通り）----
     Replitデザインシステムをここだけに適用する。ダッシュボード/設定は
     :root の --ink / --accent / --r-* / .dot / .btn-primary をそのまま使っていて
     このスコープの外なので、色は .rf にローカルなカスタムプロパティとして
     持たせ、既存トークンには一切触れない。
     .intercept / .screen-rise 自体は上のアニメーション定義（頻度で強度を
     変える設計）をそのまま使う。ここで足すのは見た目のレイヤーだけ */
  .rf{
    --rf-ember:#ff3c00;
    --rf-coral:#ff764c;
    --rf-peach:#ffb199;
    --rf-rust:#ec4e02;
    --rf-blue:#2492ff;
    --rf-canvas:#faf6f1;
    --rf-white:#ffffff;
    --rf-black:#0e0e0f;
    --rf-pewter:#52545a;
    --rf-sand:#dfddd8;
    --rf-halftone:#524ae9;
    /* それでもひらくボタン専用。Ember Orangeそのままだと赤寄りに見えて
       強すぎるという声を受け、彩度と明度を落として朱色寄りにした。
       黒文字とのコントラストは4.53:1を保っている。これより暗くすると
       4.5を割るので、押した時の変化は色を暗くせずopacityだけ落とす */
    --rf-btn-red:#d1512e;
    --rf-font:'Inter','Noto Sans JP','Hiragino Sans','Yu Gothic UI','Segoe UI',sans-serif;
    --rf-pad:20px;
    --rf-card-pad:32px;

    display:flex;flex-direction:column;justify-content:center;
    min-height:100vh;
    margin:0 -24px calc(-48px - env(safe-area-inset-bottom));
    padding:32px var(--rf-pad) calc(80px + env(safe-area-inset-bottom));
    background:var(--rf-canvas);color:var(--rf-pewter);
    font-family:var(--rf-font);font-weight:400;font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  @media (max-width:479px){ .rf{ --rf-pad:16px; --rf-card-pad:26px; } }
  .rf .eyebrow{color:var(--rf-pewter);margin-bottom:14px}
  .rf h1{
    font-family:var(--rf-font);font-weight:500;letter-spacing:-0.04em;line-height:1.16;
    color:var(--rf-black);
  }
  .rf button:focus-visible{outline-color:var(--rf-blue)}

  /* ---- 問い詰め ---- */
  .rf h1{font-size:clamp(36px,9vw,52px);margin-bottom:32px}
  .rf .choices{display:flex;flex-direction:column;gap:12px}
  .rf .choice{
    display:flex;align-items:center;gap:12px;
    width:100%;min-height:64px;padding:18px 20px;text-align:left;
    background:var(--rf-white);border:1px solid var(--rf-sand);border-radius:20px;
    font-family:var(--rf-font);font-size:16px;font-weight:500;color:var(--rf-black);
    transition:transform 150ms var(--ease-out), border-color 150ms var(--ease-out);
  }
  .rf .choice:active{background:var(--rf-white);transform:scale(.985)}
  /* 無意識側はEmberの枠で囲い、目的あり側はSandの細線で静かに置く。
     4色を使い分けていた元の色分けは、群（無意識/目的あり）の告発に統一する */
  .rf .choice.impulse{border:1.5px solid var(--rf-ember)}
  .rf-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--rf-sand)}
  .rf .choice.impulse .rf-dot{background:var(--rf-ember)}
  .rf .choice .txt{flex:1;min-width:0}
  /* Prompt Input Bar から借りた円形アクション。押せる場所を形で示す */
  .rf .go{
    width:40px;height:40px;flex:none;border-radius:50%;
    display:grid;place-items:center;font-size:15px;line-height:1;
    border:1px solid var(--rf-sand);color:var(--rf-pewter);background:var(--rf-canvas);
  }
  .rf .choice.impulse .go{background:var(--rf-ember);border-color:var(--rf-ember);color:var(--rf-white)}
  .rf .context-line{margin-top:26px;font-size:14px;color:var(--rf-pewter)}

  /* ---- 返し ---- */
  .rf .reason-tag{
    display:inline-flex;align-self:flex-start;align-items:center;gap:7px;
    margin-bottom:16px;padding:5px 11px;border-radius:6px;
    background:var(--rf-white);border:1px solid var(--rf-sand);
    font-size:12px;font-weight:500;color:var(--rf-black);
  }
  .rf .reason-tag .rf-dot{width:7px;height:7px}
  .rf .reason-tag.impulse .rf-dot{background:var(--rf-ember)}
  /* フィーチャーカード。1画面に1枚だけ置く句読点。Peach Blush上ではPewterが
     4.33:1で本文基準を割るので、Ink Blackを混ぜて6.9:1にする */
  .rf .feature{border-radius:28px;padding:var(--rf-card-pad);background:var(--rf-peach)}
  /* AIの一言でも固定のfu.lineでも、見出しはこのカードの中の同じ役割。
     .agent-h1の有無で大きさが変わらないよう、共通の親(.feature)側でサイズを決める */
  .rf .feature h1{font-size:clamp(28px,7.5vw,40px);letter-spacing:-0.035em;margin-bottom:0}
  .rf .feature .alt{
    margin-top:16px;color:color-mix(in srgb, var(--rf-black) 78%, var(--rf-peach));
  }
  /* AIの一言が見出しそのものになる。届くまでは点を出しておき、
     失敗したら固定のセリフに差し替わる（見出しが空のままにならないように） */
  .rf h1.agent-h1{min-height:1.5em;white-space:pre-wrap}
  .rf .agent-note{margin-top:10px;font-size:12px;color:var(--rf-rust);line-height:1.7}
  .rf .thinking::after{
    content:"";display:inline-block;width:9px;height:9px;border-radius:50%;
    background:color-mix(in srgb, var(--rf-black) 55%, transparent);
    animation:agent-pulse 1.1s ease-in-out infinite;vertical-align:middle;
  }
  @keyframes agent-pulse{0%,100%{opacity:.18}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.rf .thinking::after{animation:none;opacity:.5}}
  .rf .fu-actions{display:flex;flex-direction:column;gap:10px;margin-top:32px}
  .rf-btn{
    width:100%;min-height:60px;padding:16px 24px;border-radius:100px;
    font-family:var(--rf-font);font-size:18px;font-weight:500;letter-spacing:-0.01em;
    transition:transform 150ms var(--ease-out), background 150ms var(--ease-out);
  }
  .rf-btn:active{transform:scale(.985)}
  /* 白文字は4.53:1しか出ない --rf-btn-red 上でも本文基準ぎりぎり足りないので
     Ink Blackを使う（4.53:1）。押した時は色を暗くすると基準を割るので
     opacityだけ落とす */
  .rf-btn-primary{background:var(--rf-btn-red);border:1.5px solid var(--rf-btn-red);color:var(--rf-black)}
  .rf-btn-primary:active{opacity:.85}
  .rf-btn-secondary{background:transparent;border:1.5px solid var(--rf-sand);color:var(--rf-pewter)}
  /* やめておくボタンだけは主従（primary/secondaryの入れ替わり）に関わらず
     常にElectric Blue。白文字/文字色に使うとどちらもコントラスト基準を
     割るので、他ボタンと同じくInk Black文字のまま枠と塗りだけ効かせる */
  #stay.rf-btn-primary{background:var(--rf-blue);border-color:var(--rf-blue);color:var(--rf-black)}
  #stay.rf-btn-primary:active{background:#1c7ee0;border-color:#1c7ee0}
  #stay.rf-btn-secondary{border-color:var(--rf-blue);color:var(--rf-black)}

  /* ---- 引き返した／それでも開く／素通り ----
     .rf と .done はどのレンダーでも同じ要素に付く（class="rf done ..."）ので
     ここは子孫セレクタ（.rf .done）ではなく複合セレクタ（.rf.done）で書く。
     スペースを入れると「.rf の子孫にある .done」を探すことになり一致しない */
  .rf.done{position:relative}
  .rf.done h1{font-size:clamp(24px,6vw,30px);letter-spacing:-0.03em;line-height:1.3;margin-bottom:10px}
  .rf.done p{color:var(--rf-pewter)}
  .rf.done .rf-link{
    display:inline-flex;align-items:center;min-height:44px;align-self:flex-start;margin-top:20px;
    font-family:var(--rf-font);font-size:16px;font-weight:500;color:var(--rf-black);
    text-decoration:underline;text-decoration-color:var(--rf-blue);
    text-decoration-thickness:2px;text-underline-offset:4px;
  }
  /* 引き返した画面だけ、Calderaのハーフトーンドット地を敷き、数字を直に乗せる。
     それでも開く／素通りの画面は開いてしまった側なので、この演出は付けない */
  .rf.done.win::before{
    /* position:absoluteの起点は relative 親のパディング境界。inset:0だけで
       .rf自身のpadding（上下非対称・safe-area込み）の外周までちょうど埋まる */
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(
      color-mix(in srgb, var(--rf-halftone) 26%, transparent) 1.7px, transparent 1.8px);
    background-size:24px 24px;
  }
  .rf .win-body{position:relative}
  .rf .count{
    font-family:var(--rf-font);font-weight:500;
    font-size:clamp(76px,17vw,108px);line-height:.92;letter-spacing:-0.06em;
    color:var(--rf-ember);margin-bottom:18px;
  }
  .rf .marks{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:24px}
  .rf .marks i{
    width:10px;height:10px;border-radius:50%;display:block;background:transparent;
    border:1.5px solid color-mix(in srgb, var(--rf-black) 26%, transparent);
  }
  .rf .marks i.on{background:var(--rf-ember);border-color:var(--rf-ember)}

  /* ---- dashboard chrome ----
     apple-design: ナビは半透明マテリアル。コンテンツが下を流れる */
  .chrome-top{
    position:sticky;top:0;z-index:10;
    margin:0 -24px;padding:0 24px;
    background:rgba(250,246,241,.78);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    backdrop-filter:blur(20px) saturate(180%);
  }
  @media (prefers-reduced-transparency: reduce){
    .chrome-top{background:var(--page-bg);-webkit-backdrop-filter:none;backdrop-filter:none}
  }
  header.top{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:20px 0 6px;
  }
  .brand-group{display:flex;align-items:center;gap:7px}
  .brand-icon{flex:none;display:block}
  .brand{font-size:15px;font-weight:700}
  .date{font-size:12px;color:var(--ink-3);letter-spacing:.06em}
  nav.tabs{display:flex;gap:20px;border-bottom:1px solid var(--hairline)}
  nav.tabs button{
    position:relative;
    min-height:44px;padding:10px 4px;font-size:15px;font-weight:600;color:var(--ink-3);
    margin-bottom:-1px;border-radius:0;
    transition:color 160ms var(--ease-out), transform 160ms var(--ease-out);
  }
  nav.tabs button[aria-selected="true"]{color:var(--ink)}
  .tab-ink{
    position:absolute;left:0;right:0;bottom:0;height:2px;
    background:var(--accent);border-radius:2px 2px 0 0;
    view-transition-name:tab-ink;
  }
  main{padding-top:28px}

  /* View Transitions: タブ切替のクロスフェードを短く */
  ::view-transition-old(root),
  ::view-transition-new(root){animation-duration:180ms}
  ::view-transition-old(tab-ink),
  ::view-transition-new(tab-ink){animation-duration:220ms;animation-timing-function:var(--ease-out)}

  section{margin-bottom:36px}

  /* ---- おじさんマスコット ----
     今日の結果（開いた回数 / 引き返した回数）で3態を出し分ける。
     絵はcircle/rect/ellipse/短いpathだけで組んだオリジナルのSVGで、
     実在の素材からのトレースではない（依頼されたOJIMATEはこの環境の
     ネットワーク制限で参照できなかったため）。3ポーズぶんの座標を
     それぞれ直接持たせてあり、CSSの変形で1体を無理に使い回してはいない */
  .oji-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px}
  .oji-stage{height:118px;display:flex;align-items:flex-end}
  .oji-stage svg{height:100%;width:auto;display:block}
  .oji-caption{font-size:13px;font-weight:500;color:var(--ink-2)}

  .oji .oj-rig{transform-origin:70px 96px}
  /* standing: 微かな呼吸ゆらぎだけ */
  .oji.mood-stand .oj-rig{animation:oj-breathe 3.2s ease-in-out infinite}
  @keyframes oj-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  /* dancing: 弾んで左右に振れる。星は明滅をずらして散らす */
  .oji.mood-dance .oj-rig{animation:oj-bop .55s ease-in-out infinite}
  @keyframes oj-bop{
    0%,100%{transform:translateY(0) rotate(-6deg)}
    50%{transform:translateY(-10px) rotate(6deg)}
  }
  .oji .oj-sparkle{animation:oj-twinkle 1.1s ease-in-out infinite}
  .oji .oj-sparkle.s2{animation-delay:.25s}
  .oji .oj-sparkle.s3{animation-delay:.5s}
  .oji .oj-sparkle.s4{animation-delay:.75s}
  @keyframes oj-twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
  /* lying: 潰れて呼吸するだけ。zzzがゆっくり明滅する */
  .oji.mood-lying .oj-rig{transform-origin:95px 70px;animation:oj-lie-breathe 2.6s ease-in-out infinite}
  @keyframes oj-lie-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.015)}}
  .oji .oj-zzz{animation:oj-zzz 2.2s ease-in-out infinite}
  @keyframes oj-zzz{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
  @media (prefers-reduced-motion:reduce){
    .oji .oj-rig,.oji .oj-sparkle,.oji .oj-zzz{animation:none}
    .oji .oj-sparkle{opacity:.55}
  }

  /* hero */

  /* 割合の問いかけカード */

  /* 高さをJSで実測して開閉する（fr単位のtransitionは環境差が大きいため） */

  input[type="text"],input[type="number"]{

    width:100%;padding:10px 12px;font:inherit;font-size:15px;line-height:1.7;

  .minutes-grid .cell label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:5px}

  .conv-row input[type="text"]{flex:1}
  .conv-row input[type="number"]{width:74px;flex:none}

  .danger{
    display:inline-flex;align-items:center;min-height:44px;padding:4px 2px;

  details.setup{border:1px solid var(--hairline);border-radius:20px;padding:0 18px}
  details.setup summary{
    min-height:44px;padding:16px 0;font-size:15px;font-weight:500;cursor:pointer;list-style:none;
    display:flex;justify-content:space-between;align-items:center;

  details.setup summary::after{content:"＋";color:var(--ink-3);font-weight:400}
  details.setup[open] summary::after{content:"－"}
  details.setup ol{padding:0 0 18px 20px;font-size:14px;color:var(--ink-2);line-height:2}
  details.setup li b{color:var(--ink)}

  .toast{
    position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%, 8px) scale(0.97);
    background:var(--ink);color:#fff;font-size:13px;font-weight:500;
    padding:9px 18px;border-radius:99px;opacity:0;pointer-events:none;
    white-space:nowrap;

    transition:opacity 150ms var(--ease-out), transform 150ms var(--ease-out);

  .toast.show{
    opacity:1;transform:translate(-50%, 0) scale(1);
    transition-duration:200ms;
  }

  /* ---- action sheet（全消去の確認モーダル） ---- */
  .scrim{
    position:fixed;inset:0;z-index:20;background:rgba(14,14,15,.4);
    opacity:0;transition:opacity 200ms var(--ease-out);
  }
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:21;
    max-width:520px;margin:0 auto;
    background:var(--bg);border-radius:28px 28px 0 0;
    padding:24px 24px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform 320ms var(--ease-drawer);
  }
  .sheet-open .scrim{opacity:1}
  .sheet-open .sheet{transform:translateY(0)}
  .sheet-closing .scrim{opacity:0;transition-duration:200ms}
  .sheet-closing .sheet{transform:translateY(100%);transition-duration:240ms}
  .sheet h3{font-size:17px;font-weight:500;margin-bottom:6px}

    font-size:16px;font-weight:500;color:var(--ink-2);

  /* reduced motion = ゼロではなく「揺れない」。opacityは残しtransformの移動を消す */
  @media (prefers-reduced-motion: reduce){
    .screen-rise, main>section{transition:opacity 150ms ease;transform:none}
    .toast{transform:translate(-50%,0)}

    .sheet-open .sheet{opacity:1}
    button:active,.choice:active{transform:none;opacity:.7}
    .fold-body{transition:none}
    .fold-head .arrow{transition:none}
    /* .rf .choice:active と .rf-btn:active は .choice:active / button:active より
       詳細度が高く、この上のルールに勝ってしまう。同じ強さで打ち消す */
    .rf .choice:active,.rf-btn:active{transform:none;opacity:.7}
  }

<div id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";

/* ================= data ================= */

/* group: 無意識＝赤系（開いた自分を疑うべき理由）／目的あり＝青系（道具として使えている理由） */
const REASONS = [
  { id:"hima",    label:"暇つぶし",   color:"var(--r-hima)",    group:"無意識"   },
  { id:"tohi",    label:"逃避",       color:"var(--r-tohi)",    group:"無意識"   },
  { id:"shirabe", label:"調べもの",   color:"var(--r-shirabe)", group:"目的あり" },
  { id:"work",    label:"勉強や仕事", color:"var(--r-work)",    group:"目的あり" },
];
const R = Object.fromEntries(REASONS.map(r=>[r.id,r]));

const DEFAULT_SETTINGS = {
  apps: [
    { id:"instagram", name:"Instagram", scheme:"instagram://" },
    { id:"x",         name:"X",         scheme:"twitter://" },
    { id:"tiktok",    name:"TikTok",    scheme:"tiktok://" },
    { id:"youtube",   name:"YouTube",   scheme:"youtube://" },
  ],
  reasonMinutes: { hima:15, tohi:20, shirabe:5, work:10 },
  graceMin: 5,
  agent: { endpoint:"", secret:"", voice:"", dailyMax:20 },
  conversions: [
    { name:"軽いアプリのプロトタイプを作る", min:60 },
    { name:"筋トレ1セット",                   min:30 },
    { name:"企業研究1社ぶん",                 min:30 },
    { name:"資格の勉強を1単元",               min:20 },
    { name:"SPIを10問",                       min:20 },
    { name:"本を20ページ読む",                min:15 },
  ],
};

const LS = {
  get(key, fallback){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} },
};

// DEFAULT_SETTINGSはディープコピーして基底にする（浅いコピーだと settings.apps が
// DEFAULT_SETTINGS.apps と同じ参照になり、スキーム編集で初期値が汚染され「全消去」が壊れる）
let settings = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), LS.get("nh_settings", {}));
settings.reasonMinutes = Object.assign({}, DEFAULT_SETTINGS.reasonMinutes, settings.reasonMinutes);
settings.agent = Object.assign({}, DEFAULT_SETTINGS.agent, settings.agent);
let events = LS.get("nh_events", []);           // {t, app, reason, kind:"open"|"resist"}
let lastAllowed = LS.get("nh_last", {});        // {appId: epoch ms}
let recentLines = LS.get("nh_lines", []);       // 直近に言われたセリフ（毎回ちがうことを言わせるため）
let agentCount = LS.get("nh_agentcount", {});
let lastAngle  = LS.get("nh_angle", "");    // 直前に使った切り口（連続で同じにしない）
let calCache   = LS.get("nh_cal", null);    // {day, text} ショートカットから受け取った今日の予定   // {日付: 回数} APIは従量課金なので1日の上限を持つ

function saveSettings(){ LS.set("nh_settings", settings); }
function saveEvents(){ LS.set("nh_events", events); }
function saveLast(){ LS.set("nh_last", lastAllowed); }
function saveLines(){ recentLines = recentLines.slice(-6); LS.set("nh_lines", recentLines); }
/* 今日すでに何回声をかけてもらったか。日付が変わったら勝手にリセットされる */
function agentUsedToday(){ return agentCount[todayKey()] || 0; }
function bumpAgentCount(){
  agentCount = { [todayKey()]: agentUsedToday() + 1 };  // 今日ぶんだけ残す
  LS.set("nh_agentcount", agentCount);
}

/* ================= helpers ================= */

const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function dayKey(t){
  const d = new Date(t);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
const todayKey = () => dayKey(Date.now());
const WD = ["日","月","火","水","木","金","土"];

function appName(id){
  const a = settings.apps.find(a=>a.id===id);
  return a ? a.name : id;
}
function estMinutes(evs){
  return evs.reduce((s,e)=> s + (e.kind==="open" && e.reason ? (settings.reasonMinutes[e.reason]||0) : 0), 0);
}
function eventsOn(key){ return events.filter(e => dayKey(e.t) === key); }

/* iOS風アクションシート。confirm()の置き換え */
function showSheet({ title, message, confirmLabel, onConfirm }){
  const wrap = document.createElement("div");
  wrap.className = "sheet-wrap";
  wrap.innerHTML = `
    <div class="scrim"></div>
    <div class="sheet" role="alertdialog" aria-modal="true" aria-label="${esc(title)}">
      <h3>${esc(title)}</h3>
      <p>${esc(message)}</p>
      <button class="btn-destructive">${esc(confirmLabel)}</button>
      <button class="btn-cancel">キャンセル</button>
    </div>`;
  document.body.appendChild(wrap);

  const close = () => {
    wrap.classList.remove("sheet-open");
    wrap.classList.add("sheet-closing");
    document.removeEventListener("keydown", onKey);
    // 退場（240ms）が終わってから片付ける
    setTimeout(()=> wrap.remove(), 280);
  };
  const onKey = e => { if(e.key === "Escape") close(); };

  wrap.querySelector(".scrim").addEventListener("click", close);
  wrap.querySelector(".btn-cancel").addEventListener("click", close);
  wrap.querySelector(".btn-destructive").addEventListener("click", ()=>{ close(); onConfirm(); });
  document.addEventListener("keydown", onKey);

  // 挿入フレームの後にクラスを付けてtransitionを発火させる
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    wrap.classList.add("sheet-open");
    wrap.querySelector(".btn-cancel").focus();
  }));
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> el.classList.remove("show"), 1800);
}

/* 「本来なら」換算文 */
/* 収まる項目の中から選ぶ。分数の大きい順に決め打ちだと、同じ理由では毎回
   同じ項目しか出てこず「SPIの話しかされない」状態になるので、
   収まるものをシャッフルしてから詰める */
/* 呼び出し側はどこも「〜ができる。」のように名詞で受けて文を結ぶが、
   conversionsには「本を20ページ読む」のような動詞止めの項目名も混ざっていて、
   そのまま繋ぐと「本を20ページ読むができる。」になってしまう。
   ひらがなのう段止まりを動詞とみなし、そこにだけ「こと」を挟んで名詞化する */
const needsKoto = s => /[うくぐすずつづぬふぶむゆる]$/.test(s);
function couldHaveText(totalMin, shuffle){
  let items = settings.conversions.filter(c=>c.min>0 && c.min<=totalMin);
  items = shuffle
    ? items.map(c=>[Math.random(), c]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])
    : [...items].sort((a,b)=>b.min-a.min);
  let rest = totalMin;
  const done = [];
  for(const it of items){
    if(done.length >= 2) break;
    const n = Math.floor(rest / it.min);
    if(n >= 1){
      // 「〜を作る」のような項目名だと「を」が重複するので括弧書きにする
      const label = n > 1 ? `${it.name}（${n}回ぶん）` : it.name;
      done.push(needsKoto(it.name) ? `${label}こと` : label);
      rest -= n * it.min;
    }
  }
  return done;
}

/* ショートカットから ?cal=... で渡された今日の予定を覚えておく。
   カレンダーAPIのOAuthを組まずに済ませるための経路。日付が変わったら捨てる */
function captureCalendar(raw){
  if(raw == null) return;
  const text = String(raw).trim().slice(0, 600);
  calCache = text ? { day: todayKey(), text } : null;
  if(calCache) LS.set("nh_cal", calCache);
  else try{ localStorage.removeItem("nh_cal"); }catch(e){}
}
function todaysCalendar(){
  return (calCache && calCache.day === todayKey() && calCache.text) ? calCache.text : "";
}

/* ================= エージェント ================= */

/* Workers経由でClaudeにひとこともらう。届いた文字からonDeltaに流す。
   APIキーをブラウザに置けないので直接は叩かない（worker/index.js を参照） */
async function askAgent({ system, user, onDelta }){
  const a = settings.agent || {};
  if(!a.endpoint) return null;
  const res = await fetch(a.endpoint, {
    method: "POST",
    headers: { "content-type":"application/json", "x-togame-key": a.secret || "" },
    body: JSON.stringify({ system, user }),
  });
  if(!res.ok) throw new Error((await res.text()).slice(0,300) || String(res.status));

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", out = "";
  for(;;){
    const { value, done } = await reader.read();
    if(done) break;
    buf += dec.decode(value, { stream:true });
    const lines = buf.split("\n");
    buf = lines.pop();
    for(const line of lines){
      if(!line.startsWith("data:")) continue;
      let ev;
      try{ ev = JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
      /* thinkingのdeltaも流れてくるのでtext_deltaだけ拾う */
      if(ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta"){
        out += ev.delta.text;
        if(onDelta) onDelta(ev.delta.text, out);
      }
    }
  }
  return out.trim();
}

/* 人格。「普段話しているAIが、そのままトガメに出てくる」という建て付け。
   命令形を禁じているのは心理的リアクタンス対策——統制的な言い方をされると、
   言われた内容だけでなく言った相手ごと拒絶される（source derogation）。
   ただし「命令しない」と「当たり障りなく言う」は別物。前者だけを守らせて、
   内容はむしろ痛いところを突かせる。無難な一言は読み飛ばされて終わる。
   毎回ちがう角度を要求しているのは慣れ（habituation）対策 */
function agentSystem(){
  const voice = ((settings.agent && settings.agent.voice) || "").trim();
  /* ルールを並べすぎると、オープンモデルはルール順守の優等生な文を書いて
     口調を無視する。ルールは最小限にして、口調を最後に、最優先として置く */
  const lines = [
    "SNSを開こうとしている人に、その場でひとこと言う役です。",
    "説教でも通知でもなく、隣にいる人の言葉として言います。",
    "",
    "# ルール",
    "- 渡された事実の中から、いちばん都合の悪いものを1つだけ名指しする。",
    "- 一般論を書いたら失敗。「時間は大切」「後悔するかも」「有意義に」の類は禁止。",
    "- 命令しない。「〜すべき」「〜した方がいい」は使わない。決めるのは本人。",
    "- 1〜2文。前置き・自己紹介・かぎ括弧なし。セリフだけを返す。",
    "- 直前に言ったのと同じ言い回しは使わない。",
    "- 数字は必ず半角で、渡された値をそのまま書く。省略や伏せ字にしない。",
  ];
  if(voice){
    lines.push(
      "",
      "# 話し方（最優先）",
      "次に書かれた話し方を、そのまま真似てください。",
      "上のルールと衝突したら、必ずこちらを優先します。",
      "",
      voice,
    );
  }
  return lines.join("\n");
}

/* いま何が起きているかを、事実だけ渡す */
/* 毎回ちがう切り口を1つ指定する。以前は「直前に言ったこと」を見せて避けさせて
   いたが、実験したら逆効果で、見せた型をそのまま真似て毎回そっくりな文に
   なっていた。見せずに角度だけ変える方が散る */
const ANGLES = [
  "今日すでに何回開いているか、その回数に触れる。",
  "いまの時刻そのものに触れる（こんな時間に、まだ早いのに、など）。",
  "開かずに引き返せた回数に触れて、そこを認める。",
  "同じ時間で他にできたはずのことに触れる。",
  "選んだ理由そのものに触れて、短く突っ込む。",
  "今日の合計時間に触れる。",
  "今日のこの先の予定や締切に触れる。",
];

function followupPrompt(appId, reason){
  const todayAll = eventsOn(todayKey());
  const todayEvs = todayAll.filter(e=>e.app===appId);
  const nth      = todayEvs.filter(e=>e.kind==="open").length;
  const resists  = todayAll.filter(e=>e.kind==="resist").length;
  const now      = new Date();
  const alt      = couldHaveText(settings.reasonMinutes[reason] || 0, true);
  const cal      = todaysCalendar();

  /* 予定が無いときは予定の切り口を外す。直前と同じ角度も続けない */
  let pool = ANGLES.filter(a => cal ? true : !a.includes("予定"));
  if(pool.length > 1) pool = pool.filter(a => a !== lastAngle);
  const angle = pool[Math.floor(Math.random() * pool.length)];
  lastAngle = angle;
  LS.set("nh_angle", angle);

  return [
    `いま ${appName(appId)} を開こうとして、理由に「${R[reason].label}」を選んだところ。`,
    `時刻は${now.getHours()}時${String(now.getMinutes()).padStart(2,"0")}分。`,
    `${appName(appId)}は今日${nth}回目。${appName(appId)}に今日${estMinutes(todayEvs)}分、SNS全体で${estMinutes(todayAll)}分。`,
    resists ? `今日は${resists}回、開かずに引き返している。` : "",
    alt.length ? `この人が「同じ時間があればできたのに」と自分で登録しているのは: ${alt.join("、")}。` : "",
    cal ? `今日のこの先の予定: ${cal}` : "",
    `\n今回の切り口: ${angle}`,
    "この人に、ひとこと。",
  ].filter(Boolean).join("\n");
}

/* 声をかけられる状態か。上限は設定で決める（Workers AIの無料枠は
   1日10,000ニューロン＝トガメ約370回ぶんなので、実質は歯止め用） */
function agentAvailable(){
  const a = settings.agent || {};
  if(!a.endpoint) return false;
  const max = Number(a.dailyMax);
  if(max > 0 && agentUsedToday() >= max) return false;
  return true;
}

async function runAgentLine(appId, reason){
  const el = document.getElementById("agent-line");
  if(!el || !agentAvailable()) return;
  bumpAgentCount();
  el.classList.add("thinking");
  let got = "", err = "";
  try{
    got = await askAgent({
      system: agentSystem(),
      user: followupPrompt(appId, reason),
      onDelta(_d, all){ el.classList.remove("thinking"); el.textContent = all; },
    }) || "";
  }catch(e){ got = ""; err = String((e && e.message) || e).slice(0, 120); }
  el.classList.remove("thinking");

  if(got){
    el.textContent = got;
    recentLines.push(got);
    saveLines();
  }else{
    /* 届かなかったら見出しが空になるので固定のセリフに落とす。ただし黙って
       落とすと「AIの出来が悪い」ように見えてしまうので、落ちたことを明示する */
    el.textContent = FU[reason].line;
    el.classList.remove("agent-h1");
    const note = document.getElementById("agent-note");
    if(note){
      note.textContent = err ? ("AIに届かなかった: " + err) : "AIに届かなかった（固定の文を表示中）";
      note.hidden = false;
    }
  }
}

function renderIntercept(appId){
  const name = appName(appId);
  const todayEvs = eventsOn(todayKey()).filter(e=>e.app===appId);
  const nth = todayEvs.filter(e=>e.kind==="open").length + 1;
  const todayAll = eventsOn(todayKey());
  const min    = estMinutes(todayAll);
  const appMin = estMinutes(todayEvs);
  const detail = (min - appMin) > 0
    ? `${name}だけで${appMin}分、SNS全体で${min}分`
    : `${name}に${appMin}分`;
  const ctx = nth === 1
    ? "今日はじめての起動。"
    : `今日${nth}回目。ここまで${detail}（推定）。`;

  $app.innerHTML = `
    <div class="rf intercept">
      <p class="eyebrow">${esc(name.toUpperCase())} を開こうとしています</p>
      <h1>なんで開いたの？</h1>
      <div class="choices">
        ${REASONS.map(r=>`
          <button class="choice ${r.group==="無意識" ? "impulse" : ""}" data-reason="${r.id}">
            <span class="rf-dot"></span>
            <span class="txt">${esc(r.label)}</span>
            <span class="go">→</span>
          </button>`).join("")}
      </div>
      <p class="context-line">${esc(ctx)}</p>
    </div>`;

  $app.querySelectorAll(".choice").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const reason = btn.dataset.reason;
      // 先に「開いた」として記録。やめておくを選んだら resist に昇格する
      events.push({ t: Date.now(), app: appId, reason, kind:"open" });

      renderFollowup(appId, reason);
    });
  });
}

const FU = {
  hima: {
    line: "暇なら、それは自由時間ってこと。",
    sub:  "スクロールに払う？それとも自分に使う？",
    stay: true,
  },

    line: "何から逃げてる？",
    sub:  "開いても、それは消えないよ。",
    stay: true,
  },
  shirabe: {
    line: "OK、調べものだね。",
    sub:  "目的のものだけ調べて、終わったら閉じよう。",
    stay: false,
  },
  work: {
    line: "了解、道具として使おう。",
    sub:  "脱線しはじめたら、それは「暇つぶし」。",
    stay: false,
  },
};

function renderFollowup(appId, reason){
  const fu = FU[reason];
  const r = R[reason];
  const m = settings.reasonMinutes[reason] || 0;
  const alt = couldHaveText(m);

  /* AIが喋るなら、画面はその一言だけにする。固定のセリフと換算文は、
     AIが出せないとき（目的のある理由・未設定・上限超え・失敗）の受け皿に降格 */
  const useAgent = fu.stay && agentAvailable();
  const altLine = (!useAgent && fu.stay && alt.length)
    ? `いつもの1回ぶん（約${m}分）があれば、${alt.join("と")}ができる。` : "";

  const openBtn  = `<button class="rf-btn ${fu.stay ? "rf-btn-secondary" : "rf-btn-primary"}" id="go">それでもひらく</button>`;
  const stayBtn  = `<button class="rf-btn ${fu.stay ? "rf-btn-primary" : "rf-btn-secondary"}" id="stay">やめておく</button>`;
  const impulse  = r.group === "無意識";

  $app.innerHTML = `
    <div class="rf followup screen-rise">
      <span class="reason-tag ${impulse ? "impulse" : ""}"><span class="rf-dot"></span>${esc(r.label)}</span>
      <div class="feature">
        ${useAgent
          ? `<h1 class="agent-h1 thinking" id="agent-line" aria-live="polite"></h1>
             <p class="agent-note" id="agent-note" hidden></p>`
          : `<h1>${esc(fu.line)}</h1>`}
        ${altLine ? `<p class="alt">${esc(altLine)}</p>` : ""}
      </div>
      <div class="fu-actions">
        ${fu.stay ? stayBtn + openBtn : openBtn + stayBtn}
      </div>
    </div>`;

  document.getElementById("go").addEventListener("click", ()=> allowAndOpen(appId));
  document.getElementById("stay").addEventListener("click", ()=>{
    const last = events[events.length-1];
    if(last && last.app===appId && last.kind==="open") last.kind = "resist";
    saveEvents();
    renderResistDone();
  });

  /* 声をかけるのは無意識寄りの理由のときだけ。「調べもの」「勉強や仕事」は
     目的があって開いているので、邪魔する理由がない（呼び出し回数も半分以下になる） */
  if(useAgent) runAgentLine(appId, reason);
}

/* 通行証: SNSに戻る直前にクリップボードへ書く。オートメーション側が
   これを見つけたら「消して何もしない」ことで再発火ループを切る */
function writePass(then){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText("togame-pass").then(then, then);
  }else{
    then();
  }
}

function allowAndOpen(appId){
  lastAllowed[appId] = Date.now();
  saveLast();
  const a = settings.apps.find(a=>a.id===appId);
  writePass(()=>{
    if(a && a.scheme){
      location.href = a.scheme;
    }else{
      $app.innerHTML = `<div class="rf done screen-rise"><h1>どうぞ。</h1><p>ホームに戻って${esc(appName(appId))}を開いてOK。${settings.graceMin}分間は引き止めない。</p></div>`;
    }
  });
}

function renderDashboard(){
  const evs = eventsOn(todayKey());
  if(events.length === 0){ return renderEmpty(); }

  const opens   = evs.filter(e=>e.kind==="open").length;
  const resists = evs.filter(e=>e.kind==="resist").length;
  const total   = estMinutes(evs);

  /* 換算文 */
  const could = couldHaveText(total);
  const couldHtml = total < 5
    ? `今日はまだほとんど時間を失っていない。<em>この調子。</em>`
    : (could.length
        ? `この時間があれば、<em>${could.map(esc).join("</em>と<em>")}</em>ができました。`
        : `この時間で、できたことがあったはず。`);

  /* 理由別内訳 */
  const byReason = REASONS.map(r=>{
    const n = evs.filter(e=>e.kind==="open" && e.reason===r.id).length;
    return { ...r, n, min: n * (settings.reasonMinutes[r.id]||0) };
  });
  const sumMin = byReason.reduce((s,b)=>s+b.min,0) || 1;
  const segs = byReason.filter(b=>b.min>0);

  /* いちばん多い理由の割合。無意識系が最多なら問い詰め、目的あり系なら肯定する */
  const top = byReason.reduce((a,b)=> b.n > a.n ? b : a, byReason[0]);
  const topPct = opens ? Math.round(top.n / opens * 100) : 0;
  const isMui = top.group === "無意識";
  const challengeHtml = opens && top.n > 0 ? `
    <div class="challenge ${isMui ? "red" : "blue"}">
      <span class="pct">${topPct}%</span>
      <span class="msg">が「${esc(top.label)}」。${
        isMui
          ? `その${top.min}分、本当に必要だった？`
          : `目的があって開けている。`
      }</span>
    </div>` : "";

  /* アプリ別 */
  const byApp = {};
  evs.filter(e=>e.kind==="open").forEach(e=>{ byApp[e.app]=(byApp[e.app]||0)+1; });

  /* 7日間 */
  const days = [];
  for(let i=6;i>=0;i--){
    const t = Date.now() - i*86400000;
    const key = dayKey(t);
    days.push({ key, wd: WD[new Date(t).getDay()], min: estMinutes(eventsOn(key)), today: i===0 });
  }
  const maxMin = Math.max(...days.map(d=>d.min), 30);

  /* 7日間の要約（グラフだけだと情報が薄いので平均などを添える） */
  const weekTotal = days.reduce((s,d)=>s+d.min, 0);
  const weekAvg   = Math.round(weekTotal / 7);
  const peak      = days.reduce((a,b)=> b.min > a.min ? b : a, days[0]);
  // 前の7日間（8〜14日前）と比べる
  let prevTotal = 0;
  for(let i=13;i>=7;i--) prevTotal += estMinutes(eventsOn(dayKey(Date.now() - i*86400000)));
  const prevAvg = Math.round(prevTotal / 7);
  const diff = weekAvg - prevAvg;
  const diffText = prevTotal === 0
    ? "—"
    : (diff > 0 ? `+${diff}分 増えた` : diff < 0 ? `${Math.abs(diff)}分 減った` : "変わらず");

  /* 初期表示から今日の分数を出しておく（説明文なしで押せると伝わるように） */
  const td = days[days.length-1];
  const [,tm,tdd] = td.key.split("-");
  const initReadout = `<span class="day">${Number(tm)}/${Number(tdd)}（${td.wd}）</span> <span class="min">${td.min}分</span>`;

  const ojiMood = ojisanMood(opens, resists);

  chrome("today", `
    <section class="bare">
      <div class="oji-wrap">
        <div class="oji-stage">${ojisanSvg(ojiMood)}</div>
        <p class="oji-caption">${OJI_CAPTION[ojiMood]}</p>
      </div>
    </section>

    <section>
      <div class="counts">
        <button class="count-block" id="to-heat">
          <span class="cnum">${opens}<span class="cunit">回</span></span>
          <span class="clabel">開いた<span class="chev">›</span></span>
        </button>
        <button class="count-block win" id="to-recovered">
          <span class="cnum">${resists}<span class="cunit">回</span></span>
          <span class="clabel">引き返した<span class="chev">›</span></span>
        </button>
      </div>
    </section>

    <section>
      <p class="melt-label">SNSに溶けた推定時間</p>
      <div class="melt-num">${total}<span class="unit">分</span></div>
    </section>

    ${challengeHtml}

    <section>
      <div class="could">${couldHtml}</div>
    </section>

    ${segs.length ? `
    <section>
      <h2>なぜ開いた？</h2>
      <div class="stackbar" role="img" aria-label="理由の内訳バー">
        ${segs.map(b=>`<div class="seg" style="width:${(b.min/sumMin*100).toFixed(1)}%;background:${b.color}"></div>`).join("")}
      </div>
      ${byReason.filter(b=>b.n>0).map(b=>`
        <div class="rsn-row">
          <span class="dot" style="background:${b.color}"></span>
          <span class="name">${b.label}</span>
          <span class="tag ${b.group === "無意識" ? "mui" : "moku"}">${b.group}</span>
          <span class="spacer"></span>
          <span class="nums">
            <span class="n">${b.n}回</span>
            <span class="m">推定${b.min}分</span>
          </span>
        </div>`).join("")}
    </section>` : ""}

    ${Object.keys(byApp).length ? `
    <section>
      <button class="fold-head" id="fold-app" aria-expanded="false" aria-controls="body-app">
        <h2 style="margin:0">アプリ別</h2><span class="arrow">›</span>
      </button>
      <div class="fold-body" id="body-app"><div class="inner">
        ${Object.entries(byApp).sort((a,b)=>b[1]-a[1]).map(([id,n])=>`
          <div class="app-row"><span>${esc(appName(id))}</span><span class="val">${n}回</span></div>`).join("")}
      </div></div>
    </section>` : ""}

    <section>
      <button class="fold-head" id="fold-week" aria-expanded="false" aria-controls="body-week">
        <h2 style="margin:0">この7日間</h2><span class="arrow">›</span>
      </button>
      <div class="fold-body" id="body-week"><div class="inner">
        <p class="trend-readout" id="trend-cap" aria-live="polite">${initReadout}</p>
        <div class="trend">
          ${days.map((d,i)=>`
            <div class="col${d.today?" picked":""}">
              <button class="bar${d.today?" today picked":""}" data-i="${i}"
                style="height:${Math.max(2, d.min/maxMin*100).toFixed(1)}%"
                aria-label="${d.key} 推定${d.min}分"></button>
              <span class="lbl">${d.today ? "今日" : d.wd}</span>
            </div>`).join("")}
        </div>
        <div class="week-stats">
          <div class="stat-row"><span>1日の平均</span><span class="val">${weekAvg}分</span></div>
          <div class="stat-row"><span>7日間の合計</span><span class="val">${weekTotal}分</span></div>
          <div class="stat-row"><span>いちばん多い日</span><span class="val">${peak.min > 0 ? `${peak.today ? "今日" : peak.wd+"曜"} ・ ${peak.min}分` : "—"}</span></div>
          <div class="stat-row"><span>先週の平均から</span><span class="val">${diffText}</span></div>
        </div>
      </div></div>
    </section>
  `);

  const heatBtn = document.getElementById("to-heat");
  if(heatBtn) heatBtn.addEventListener("click", ()=> swap(renderHeatmap));
  const recBtn = document.getElementById("to-recovered");
  if(recBtn) recBtn.addEventListener("click", ()=> swap(renderRecovered));

  // 見出しタップで下に展開する折りたたみ。開ききったらautoにして中身の変化に追従させる
  [["fold-app","body-app"], ["fold-week","body-week"]].forEach(([hid,bid])=>{
    const head = document.getElementById(hid), body = document.getElementById(bid);
    if(!head || !body) return;
    const inner = body.querySelector(".inner");
    head.addEventListener("click", ()=>{
      const open = body.classList.toggle("open");
      head.setAttribute("aria-expanded", String(open));
      // 実測値と0pxの往復だけで完結させる（autoを挟むと環境によって開かないため）
      body.style.height = open ? inner.offsetHeight + "px" : "0px";
    });
  });

  // 列全体をタップ領域にする（細いバーだけだと押しづらいため）
  $app.querySelectorAll(".trend .col").forEach(col=>{
    col.addEventListener("click", ()=>{
      const bar = col.querySelector(".bar");
      const d = days[Number(bar.dataset.i)];
      const [,m,dd] = d.key.split("-");
      // 選択中の日を目立たせる（前の選択は解除）
      $app.querySelectorAll(".trend .bar.picked").forEach(b=>b.classList.remove("picked"));
      $app.querySelectorAll(".trend .col.picked").forEach(c=>c.classList.remove("picked"));
      bar.classList.add("picked");
      col.classList.add("picked");
      document.getElementById("trend-cap").innerHTML =
        `<span class="day">${Number(m)}/${Number(dd)}（${d.wd}）</span> <span class="min">${d.min}分</span>`;
    });
  });
}

/* 引き返した回数 × その理由の分数 = 守りきった時間。
   スクリーンタイムでは原理的に測れない（開いていないので記録が残らない）数字 */
function recoveredMin(evs){
  return evs.reduce((s,e)=> s + (e.kind==="resist" && e.reason ? (settings.reasonMinutes[e.reason]||0) : 0), 0);
}

function renderRecovered(){
  const today = eventsOn(todayKey());
  const todayMin = recoveredMin(today);

  // 直近7日
  let weekMin = 0, weekCount = 0;
  for(let i=0;i<7;i++){
    const evs = eventsOn(dayKey(Date.now() - i*86400000));
    weekMin += recoveredMin(evs);
    weekCount += evs.filter(e=>e.kind==="resist").length;
  }
  const allMin   = recoveredMin(events);
  const allCount = events.filter(e=>e.kind==="resist").length;

  const could = couldHaveText(todayMin);
  const couldHtml = todayMin > 0 && could.length
    ? `この時間で、<em>${could.map(esc).join("</em>と<em>")}</em>ができる。`
    : `引き返すたび、ここに時間が積み上がる。`;

  /* 理由別の内訳 */
  const byReason = REASONS.map(r=>{
    const n = today.filter(e=>e.kind==="resist" && e.reason===r.id).length;
    return { ...r, n, min: n * (settings.reasonMinutes[r.id]||0) };
  }).filter(b=>b.n>0);

  chrome("today", `
    <button class="back" id="back-home">‹ 今日</button>
    <section>
      <p class="eyebrow">取り戻した時間</p>
      <div class="sub-hero">${todayMin}<span class="unit">分</span></div>
      <p class="sub-lead">今日、開かずに済ませた時間</p>
    </section>

    <section>
      <div class="could">${couldHtml}</div>
    </section>

    ${byReason.length ? `
    <section>
      <h2>引き返した理由</h2>
      ${byReason.map(b=>`
        <div class="brk-row">
          <span class="dot" style="background:${b.color}"></span>
          <span class="name">${b.label}</span>
          <span class="val">${b.n}回 ・ ${b.min}分</span>
        </div>`).join("")}
    </section>` : ""}

    <section>
      <h2>これまで</h2>
      <div class="stat-row"><span>この7日間</span><span class="val">${weekCount}回 ・ ${weekMin}分</span></div>
      <div class="stat-row"><span>累計</span><span class="val">${allCount}回 ・ ${allMin}分</span></div>
    </section>
  `);

  document.getElementById("back-home").addEventListener("click", ()=> swap(renderDashboard));
}

/* 時間帯 × 理由。いつ・どの理由で負けやすいかを出す */
const HEAT_BUCKETS = [
  { label:"深夜", hours:"0〜3時",   from:0,  to:3  },
  { label:"早朝", hours:"4〜7時",   from:4,  to:7  },
  { label:"午前", hours:"8〜11時",  from:8,  to:11 },
  { label:"昼",   hours:"12〜15時", from:12, to:15 },
  { label:"夕方", hours:"16〜19時", from:16, to:19 },
  { label:"夜",   hours:"20〜23時", from:20, to:23 },
];

function renderHeatmap(){
  // 直近7日ぶんを対象にする（1日だとマスが埋まらないため）
  const since = Date.now() - 7*86400000;
  const opens = events.filter(e=>e.kind==="open" && e.t >= since && e.reason);

  const grid = {};
  let max = 0, topCell = null;
  REASONS.forEach(r=>{
    grid[r.id] = HEAT_BUCKETS.map(()=>0);
  });
  opens.forEach(e=>{
    const h = new Date(e.t).getHours();
    const bi = HEAT_BUCKETS.findIndex(b => h >= b.from && h <= b.to);
    if(bi < 0 || !grid[e.reason]) return;
    const v = ++grid[e.reason][bi];
    if(v > max){ max = v; topCell = { reason:e.reason, bi }; }
  });

  chrome("today", `
    <button class="back" id="back-home">‹ 今日</button>
    <section>
      <h2>いつ開いてる？</h2>
      <div class="heat">
        <span></span>
        ${HEAT_BUCKETS.map(b=>`<span class="ch"><b>${b.label}</b><em>${b.hours}</em></span>`).join("")}
        ${REASONS.map(r=>`
          <span class="rh"><span class="dot" style="background:${r.color}"></span>${r.label}</span>
          ${grid[r.id].map((v,bi)=>`
            <span class="cell${v?"":" zero"}"
              style="${v?`background:${r.color};opacity:${(0.25 + 0.75*v/max).toFixed(2)}`:""}"
              title="${HEAT_BUCKETS[bi].hours} ${r.label} ${v}回">${v||""}</span>`).join("")}
        `).join("")}
      </div>
    </section>
  `);

  document.getElementById("back-home").addEventListener("click", ()=> swap(renderDashboard));
}

        <p class="hint">
          「それでも開く」を押すと通行証（<code>togame-pass</code>）を書いてからSNSに戻る設計。これで「戻る→また開く」の無限ループを防いでいる。
          手順の詳細やスクリーンショット付きの説明は <a href="SHORTCUTS-SETUP.md" style="color:var(--accent)">SHORTCUTS-SETUP.md</a> を参照。
        </p>
      </details>

      <details class="setup" style="margin-bottom:12px">
        <summary>③ 動作を確認する</summary>
        <ol>
          <li>対象のSNSを開く → トガメが出る</li>
          <li>理由を選ぶ →「それでも開く」を押す</li>
          <li>SNSが開いて、そのまま使えれば成功（トガメに戻ってこなければOK）</li>
        </ol>
      </details>

      <details class="setup" style="margin-bottom:12px">
        <summary>うまくいかないとき</summary>
        <ol>
          <li>毎回確認バナーが出る → オートメーションが「実行前に尋ねる」になっている。「すぐに実行」に変更する</li>
          <li>ループが直らない → ifの条件が「次を含む」で <code>togame-pass</code> になっているか確認</li>
          <li>トガメ自体が開かない → 「URLを開く」が【その他の場合】の中に入っているか確認</li>
          <li>急に何も反応しなくなった → クリップボードに <code>togame-pass</code> が残ったまま。何か別のものを一度コピーすれば直る</li>
        </ol>
      </details>
    </div>`;
  document.getElementById("howto-back").addEventListener("click", ()=> swap(back));
}

function renderSettings(){
  chrome("settings", `
    <section class="bare">
      <button class="add-btn" id="open-howto">使い方を見る（初めての設定・つまづいたとき）</button>
    </section>
    <section>
      <h2>監視するアプリ</h2>
      <p class="hint" style="margin:0 0 14px">
        トガメが問い詰める相手。各アプリの<b>「URLをコピー」</b>を押して、iPhoneの「ショートカット」アプリのオートメーション<b>「Appが開かれたとき → URLを開く」</b>に貼ると、そのSNSを開くたびトガメが出る。<br>
        <b>URLスキーム</b>（例: <code>instagram://</code>）は、問い詰めのあと元のSNSへ戻る入口。分からなければ空でOK。
      </p>
      <div id="apps">
        ${settings.apps.map((a,i)=>`
          <div class="set-card">
            <div class="name-line">
              <strong>${esc(a.name)}</strong>
              <button class="del" data-del="${i}">削除</button>
            </div>
            <button class="copy-url" data-copy="${i}">${esc(a.name)}用のURLをコピー</button>
            <div class="field">
              <label>URLスキーム（元のSNSに戻る入口）</label>
              <input type="text" data-scheme="${i}" value="${esc(a.scheme)}" placeholder="instagram://">
            </div>
          </div>`).join("")}
      </div>
      <button class="add-btn" id="add-app">＋ アプリを追加</button>
    </section>

    <section>
      <h2>声をかけてくる相手</h2>
      <p class="hint" style="margin:0 0 12px">普段あなたが話しているClaudeを、そのままここに呼んでくる。<code>worker/</code> のWorkerを立てて、その住所と合言葉を入れる。空のままなら今まで通り固定のセリフだけ。</p>
      <div class="field">
        <label for="ag-endpoint">Workerの住所</label>
        <input type="text" id="ag-endpoint" value="${esc(settings.agent.endpoint)}" placeholder="https://togame-agent.xxxx.workers.dev" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="ag-secret">合言葉</label>
        <input type="text" id="ag-secret" value="${esc(settings.agent.secret)}" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="ag-voice">口調（普段のカスタム指示をそのまま貼る）</label>
        <textarea id="ag-voice" rows="5" placeholder="ClaudeやChatGPTの「どう応答してほしいか」の設定を、そのままコピーして貼る">${esc(settings.agent.voice)}</textarea>
      </div>
      <div class="field">
        <label for="ag-max">1日に声をかけてもらう上限（今日はここまで ${agentUsedToday()} 回）</label>
        <input type="number" id="ag-max" value="${settings.agent.dailyMax}" min="0" max="200" inputmode="numeric">
      </div>
      <p class="hint" style="margin:8px 0 0">APIは1回ごとに課金される（Claude Proの月額とは別の財布）。上限を超えた分は固定のセリフだけになる。0にすると声かけを止める。「調べもの」「勉強や仕事」を選んだときは、そもそも呼ばない。</p>
      <button class="copy-url" id="ag-test">つながるか試す</button>
      <p class="hint" id="ag-result" style="margin:8px 0 0" aria-live="polite"></p>
    </section>

    <section>
      <h2>1回開いたら何分溶ける？</h2>
      <div class="minutes-grid">
        ${REASONS.map(r=>`
          <div class="cell">
            <label for="min-${r.id}"><span class="dot" style="background:${r.color}"></span>${r.label}</label>
            <input type="number" id="min-${r.id}" data-rmin="${r.id}" value="${settings.reasonMinutes[r.id]}" min="0" max="180" inputmode="numeric">
          </div>`).join("")}
      </div>
    </section>

    <section>
      <h2>引き止めない時間</h2>
      <div class="field">
        <label for="grace">「それでもひらく」を選んだあと、再質問しない時間（分）</label>
        <input type="number" id="grace" value="${settings.graceMin}" min="1" max="120" inputmode="numeric">
      </div>
    </section>

    <section>
      <h2>その時間でできたはずのこと</h2>
      <div id="convs">
        ${settings.conversions.map((c,i)=>`
          <div class="conv-row">
            <input type="text" data-cname="${i}" value="${esc(c.name)}">
            <input type="number" data-cmin="${i}" value="${c.min}" min="1" max="600" inputmode="numeric" aria-label="所要分数">
            <button class="del" data-cdel="${i}">削除</button>
          </div>`).join("")}
      </div>
      <button class="add-btn" id="add-conv">＋ 項目を追加</button>
    </section>

    <section>
      <h2>データ</h2>
      <p style="display:flex;gap:18px">
        <button class="del" id="export">エクスポート</button>
        <button class="del" id="import">インポート</button>
        <button class="danger" id="wipe">全消去</button>
      </p>
    </section>
  `);

  document.getElementById("open-howto").addEventListener("click", ()=> swap(()=>renderHowTo(renderSettings)));

  /* apps */
  $app.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click", ()=>{
    settings.apps.splice(Number(b.dataset.del),1); saveSettings(); renderSettings();
  }));
  $app.querySelectorAll("[data-scheme]").forEach(inp=>inp.addEventListener("change", ()=>{
    settings.apps[Number(inp.dataset.scheme)].scheme = inp.value.trim(); saveSettings();
  }));
  $app.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click", ()=>{
    copyText(interceptUrl(settings.apps[Number(b.dataset.copy)].id));
  }));
  document.getElementById("add-app").addEventListener("click", e=>{
    const form = document.createElement("div");
    form.className = "set-card screen-rise";
    form.innerHTML = `
      <div class="field" style="margin-top:0">
        <label>アプリ名（例: Instagram）</label>
        <input type="text" id="new-app-name" autocomplete="off">
      </div>
      <button class="copy-url" id="new-app-save">追加する</button>`;
    e.currentTarget.replaceWith(form);
    const input = form.querySelector("#new-app-name");
    input.focus();
    form.querySelector("#new-app-save").addEventListener("click", ()=>{
      const name = input.value.trim();
      if(!name) { input.focus(); return; }
      const id = name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "app"+Date.now();
      settings.apps.push({ id, name, scheme:"" });
      saveSettings(); renderSettings(); toast("追加した。URLスキームも入れてね");
    });
  });

  /* minutes & grace */
  $app.querySelectorAll("[data-rmin]").forEach(inp=>["change","input"].forEach(evt=>inp.addEventListener(evt, ()=>{
    settings.reasonMinutes[inp.dataset.rmin] = Math.max(0, Number(inp.value)||0); saveSettings();
  })));
  document.getElementById("grace").addEventListener("change", e=>{
    settings.graceMin = Math.max(1, Number(e.target.value)||5); saveSettings();
  });
  /* エージェント */
  ["endpoint","secret","voice"].forEach(k=>{
    const el = document.getElementById("ag-"+k);
    /* changeはフォーカスを外すまで発火しない。貼って画面を離れると保存されて
       いないことがあるので、inputでも拾う */
    ["change","input"].forEach(evt=> el.addEventListener(evt, ()=>{
      settings.agent[k] = el.value.trim(); saveSettings();
    }));
  });
  document.getElementById("ag-max").addEventListener("change", e=>{
    settings.agent.dailyMax = Math.max(0, Number(e.target.value)||0); saveSettings();
  });
  document.getElementById("ag-test").addEventListener("click", async ()=>{
    const out = document.getElementById("ag-result");
    ["endpoint","secret","voice"].forEach(k=>{
      settings.agent[k] = document.getElementById("ag-"+k).value.trim();
    });
    saveSettings();
    if(!settings.agent.endpoint){ out.textContent = "Workerの住所が空。"; return; }
    out.textContent = "つないでいる…";
    try{
      const text = await askAgent({
        system: agentSystem(),
        user: "接続の確認をしています。いつもの調子で、ひとことだけ返してください。",
        onDelta(_d, all){ out.textContent = all; },
      });
      out.textContent = text || "返事が空だった。";
    }catch(e){
      out.textContent = "つながらない: " + ((e && e.message) || e);
    }
  });

  /* conversions */
  /* changeはフォーカスを外すまで発火しない。書き換えた直後に画面を離れると
     保存されず「変えたのに反映されない」ので、inputでも拾う */
  $app.querySelectorAll("[data-cname]").forEach(inp=>["change","input"].forEach(evt=>inp.addEventListener(evt, ()=>{
    settings.conversions[Number(inp.dataset.cname)].name = inp.value.trim(); saveSettings();
  })));
  $app.querySelectorAll("[data-cmin]").forEach(inp=>["change","input"].forEach(evt=>inp.addEventListener(evt, ()=>{
    settings.conversions[Number(inp.dataset.cmin)].min = Math.max(1, Number(inp.value)||1); saveSettings();
  })));
  $app.querySelectorAll("[data-cdel]").forEach(b=>b.addEventListener("click", ()=>{
    settings.conversions.splice(Number(b.dataset.cdel),1); saveSettings(); renderSettings();
  }));
  document.getElementById("add-conv").addEventListener("click", ()=>{
    settings.conversions.push({ name:"新しい項目", min:30 });
    saveSettings(); renderSettings();
  });

  /* data */
  document.getElementById("export").addEventListener("click", ()=>{
    copyText(JSON.stringify({ settings, events }, null, 2));
  });
  document.getElementById("import").addEventListener("click", ()=>{
    const text = window.prompt("エクスポートしたJSONを貼り付けて:");
    if(!text) return;
    let data;
    try{ data = JSON.parse(text); }
    catch(e){ toast("JSONが読めなかった"); return; }
    if(data && data.settings){
      settings = Object.assign({}, DEFAULT_SETTINGS, data.settings);
      settings.reasonMinutes = Object.assign({}, DEFAULT_SETTINGS.reasonMinutes, data.settings.reasonMinutes || {});
      saveSettings();
    }
    if(data && Array.isArray(data.events)){ events = data.events; saveEvents(); }
    toast("読み込んだ");
    renderSettings();
  });
  document.getElementById("wipe").addEventListener("click", ()=>{
    showSheet({
      title: "記録と設定を全部消す",
      message: "元に戻せない。それでもいい？",
      confirmLabel: "全部消す",
      onConfirm(){
        localStorage.removeItem("nh_events");
        localStorage.removeItem("nh_settings");
        localStorage.removeItem("nh_last");
        localStorage.removeItem("nh_lines");
        localStorage.removeItem("nh_agentcount");
        localStorage.removeItem("nh_cal");
        localStorage.removeItem("nh_angle");
        settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
        events = []; lastAllowed = {}; recentLines = []; agentCount = {}; calCache = null; lastAngle = "";
        toast("全部消した");
        swap(renderDashboard);
      },
    });
  });
}

/* 猶予時間内の再訪問: 自動リダイレクトはしない（毎回iOSの確認ダイアログが
   出て無限ループになるため）。静かな画面を出し、戻るのはユーザー操作に任せる */
function renderGrace(appId){
  const a = settings.apps.find(a=>a.id===appId);
  const backBtn = (a && a.scheme)
    ? `<button class="rf-link" id="back">${esc(appName(appId))}に戻る →</button>` : "";
  $app.innerHTML = `
    <div class="rf done screen-rise">
      <h1>さっき答えたばかり。</h1>
      <p>あと${settings.graceMin}分は引き止めない。そのまま${esc(appName(appId))}を使ってOK。</p>
      ${backBtn}
    </div>`;
  const b = document.getElementById("back");
  if(b) b.addEventListener("click", ()=>{ writePass(()=>{ location.href = a.scheme; }); });
}

/* ================= router ================= */

(function main(){
  const p = new URLSearchParams(location.search);
  const appId = p.get("app");
  captureCalendar(p.get("cal"));
  if(appId){
    const allowed = lastAllowed[appId];
    if(allowed && Date.now() - allowed < settings.graceMin * 60000){
      renderGrace(appId);
    }else{
      renderIntercept(appId);
    }
  }else{
    renderIntercept("instagram");
  }
})();
</script>
