name = "togame-agent"
main = "index.js"
compatibility_date = "2026-08-01"

# workers.dev を使わず、tsukuriba.org に直接ぶら下げる。
# custom_domain = true なら deploy 時にDNSレコードも自動で作られる。
# apex（GitHub Pagesに向いているAレコード）には触らない。
routes = [
  { pattern = "agent.tsukuriba.org", custom_domain = true }
]

# Workers AI を使うためのバインディング。これがあると env.AI が生える。
# APIキーは不要（Cloudflareアカウントの無料枠から引かれる）。
[ai]
binding = "AI"
